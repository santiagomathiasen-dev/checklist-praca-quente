<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checklist Praça Quente - Aplicativo PWA para gestão de checklist">
    <meta name="theme-color" content="#c0392b">
    <title>Checklist Praça Quente</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Checklist%20Pra%C3%A7a%20Quente%22,%22short_name%22:%22Pra%C3%A7a%20Quente%22,%22description%22:%22Aplicativo%20PWA%20para%20gestão%20de%20checklist%20da%20cozinha%20quente%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23c0392b%22,%22orientation%22:%22portrait-primary%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20192%20192%27%3E%3Crect%20fill=%27%23c0392b%27%20width=%27192%27%20height=%27192%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20font-size=%27120%27%20fill=%27white%27%20text-anchor=%27middle%27%20dominant-baseline=%27middle%27%3E🔥%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}],%22categories%22:[%22productivity%22]}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23c0392b' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle'>🔥</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }
        .header { background: #c0392b; color: white; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .btn-primary { background: white; color: #c0392b; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .btn-secondary { background: rgba(255,255,255,0.3); color: white; }
        .tabs { display: flex; gap: 0; border-bottom: 2px solid #ddd; position: sticky; top: 0; background: white; z-index: 10; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border: none; background: none; font-size: 14px; font-weight: 500; color: #666; transition: all 0.3s; }
        .tab.active { color: #c0392b; border-bottom: 3px solid #c0392b; margin-bottom: -2px; }
        .content { padding: 20px; }
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hdr-field { margin-bottom: 15px; }
        .hdr-field label { display: block; font-weight: bold; margin-bottom: 5px; color: #000; }
        .hdr-field input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; color: #000; }
        .checklist { list-style: none; }
        .checklist-item { padding: 12px; margin: 8px 0; background: #f9f9f9; border-radius: 5px; border-left: 4px solid #ddd; }
        .checklist-item input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        .checklist-item.checked { background: #e8f5e9; border-left-color: #4caf50; }
        .temp-input { margin-top: 8px; margin-left: 28px; }
        .temp-input input { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 3px; font-size: 12px; }
        .photo-section { margin: 20px 0; padding: 15px; background: #f0f7ff; border-radius: 8px; border: 2px dashed #2196f3; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .photo-item { position: relative; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #ddd; cursor: pointer; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .photo-delete { position: absolute; top: 5px; right: 5px; background: #ff4444; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 16px; }
        .report-section { background: #fff9e6; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .report-item { padding: 8px 0; border-bottom: 1px solid #ddd; }
        .progress-bar { width: 100%; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #4caf50; transition: width 0.3s; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; }
        .modal-content h2 { margin-bottom: 20px; color: #c0392b; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-confirm { background: #4caf50; color: white; }
        .btn-cancel { background: #999; color: white; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .day-item { padding: 15px; background: #f9f9f9; border: 2px solid #ddd; border-radius: 8px; text-align: center; }
        .day-item.active { background: #fff3cd; border-color: #ffc107; }
        .install-banner { background: #2196f3; color: white; padding: 15px; text-align: center; display: none; cursor: pointer; margin-bottom: 15px; border-radius: 5px; }
        .install-banner.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Praça Quente</h1>
            <p>Checklist de Controle Diário</p>
            <div class="header-buttons">
                <button class="btn btn-primary" onclick="showInstallPrompt()">📱 Instalar</button>
                <button class="btn btn-secondary" onclick="requestAdminPassword()">🔒 Admin</button>
            </div>
        </div>

        <div id="installBanner" class="install-banner" onclick="installApp()">
            📲 Toque para instalar o app no seu celular
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('checklist')">📋 Checklist</button>
            <button class="tab" onclick="switchTab('agenda')">📅 Agenda</button>
            <button class="tab" onclick="switchTab('relatorio')">📊 Relatório</button>
        </div>

        <div id="checklist" class="panel active">
            <div class="content">
                <div class="hdr-field">
                    <label>Data</label>
                    <input type="date" id="data" onchange="mudarData()">
                </div>
                <div class="hdr-field">
                    <label>Responsável</label>
                    <input type="text" id="responsavel" placeholder="Nome do responsável" onchange="salvarDados()">
                </div>

                <div class="photo-section">
                    <button class="btn btn-primary" onclick="openPhotoInput()">📸 Adicionar Foto</button>
                    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="addPhoto(event)">
                    <div id="photoGrid" class="photo-grid"></div>
                </div>

                <input type="text" id="searchBox" class="search-box" placeholder="🔍 Buscar itens..." onkeyup="searchItems()">

                <div id="progress" style="margin-bottom: 20px;">
                    <small>Progresso</small>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <ul id="checklist" class="checklist"></ul>
            </div>
        </div>

        <div id="agenda" class="panel">
            <div class="content">
                <h3>Seções por Dia</h3>
                <div id="agendaContainer"></div>
            </div>
        </div>

        <div id="relatorio" class="panel">
            <div class="content">
                <h3>Relatório do Dia</h3>
                <div id="reportContainer" class="report-section"></div>
                <button class="btn btn-primary" onclick="sendWhatsappComFotos()" style="width: 100%; margin-top: 20px; padding: 15px;">📤 Enviar via WhatsApp</button>
            </div>
        </div>
    </div>

    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h2>🔒 Acesso Admin</h2>
            <input type="password" id="passwordInput" placeholder="Digite a senha" onkeypress="if(event.key==='Enter') verifyPassword()">
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="verifyPassword()">Confirmar</button>
                <button class="btn-cancel" onclick="closePasswordModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = '37014520';
        let currentTab = 'checklist';
        let deferredPrompt = null;

        const DEFAULT_SECTIONS = [
            { id: 'sec1', name: 'Manhã', icon: '☀️' },
            { id: 'sec2', name: 'Ferramentas', icon: '🔧' },
            { id: 'sec3', name: 'Estoque', icon: '📦' },
            { id: 'sec4', name: 'Café', icon: '☕' },
            { id: 'sec5', name: 'Documentos', icon: '📝' },
            { id: 'sec6', name: 'Limpeza', icon: '🧹' },
            { id: 'sec7', name: 'Segurança', icon: '🔐' },
            { id: 'sec8', name: 'Manutenção', icon: '🔩' },
            { id: 'sec9', name: 'Qualidade', icon: '✅' },
            { id: 'sec10', name: 'Final', icon: '⏱️' }
        ];

        const DEFAULT_ITEMS = [
            { section: 'sec1', text: 'Verificar temperatura geladeira 1', temp: true },
            { section: 'sec1', text: 'Verificar temperatura geladeira 2', temp: true },
            { section: 'sec1', text: 'Verificar temperatura freezer', temp: true },
            { section: 'sec1', text: 'Iniciar equipamentos', temp: false },
            { section: 'sec1', text: 'Revisar tarefas do dia', temp: false },
            { section: 'sec2', text: 'Facas afiadas e limpas', temp: false },
            { section: 'sec2', text: 'Tábuas sanitizadas', temp: false },
            { section: 'sec2', text: 'Equipamentos funcionando', temp: false },
            { section: 'sec2', text: 'Utensílios organizados', temp: false },
            { section: 'sec2', text: 'Higiene pessoal em dia', temp: false },
            { section: 'sec3', text: 'Alimentos em quantidade adequada', temp: false },
            { section: 'sec3', text: 'Verificar data de validade', temp: false },
            { section: 'sec3', text: 'Organização do estoque', temp: false },
            { section: 'sec3', text: 'Limpeza do local de estoque', temp: false },
            { section: 'sec3', text: 'Reposição necessária', temp: false },
            { section: 'sec4', text: 'Café preparado', temp: false },
            { section: 'sec4', text: 'Xícaras e utensílios limpos', temp: false },
            { section: 'sec4', text: 'Açúcar e adoçante disponíveis', temp: false },
            { section: 'sec4', text: 'Leite/Creme fresco', temp: false },
            { section: 'sec4', text: 'Máquina de café limpa', temp: false },
            { section: 'sec5', text: 'Registro de temperatura atualizado', temp: false },
            { section: 'sec5', text: 'Checklist preenchido', temp: false },
            { section: 'sec5', text: 'Pendências registradas', temp: false },
            { section: 'sec5', text: 'Assinado pelo responsável', temp: false },
            { section: 'sec5', text: 'Documentação organizada', temp: false },
            { section: 'sec6', text: 'Pisos limpos e secos', temp: false },
            { section: 'sec6', text: 'Bancadas sanitizadas', temp: false },
            { section: 'sec6', text: 'Lixo descartado', temp: false },
            { section: 'sec6', text: 'Arejamento adequado', temp: false },
            { section: 'sec6', text: 'Organização geral', temp: false },
            { section: 'sec7', text: 'Extintores visíveis', temp: false },
            { section: 'sec7', text: 'Primeiros socorros disponível', temp: false },
            { section: 'sec7', text: 'Saídas de emergência livres', temp: false },
            { section: 'sec7', text: 'EPI dos funcionários', temp: false },
            { section: 'sec7', text: 'Equipamentos seguros', temp: false },
            { section: 'sec8', text: 'Equipamentos funcionando normalmente', temp: false },
            { section: 'sec8', text: 'Sem vazamentos', temp: false },
            { section: 'sec8', text: 'Chaves em local seguro', temp: false },
            { section: 'sec8', text: 'Iluminação adequada', temp: false },
            { section: 'sec8', text: 'Temperatura ambiente ok', temp: false },
            { section: 'sec9', text: 'Alimentos em bom estado', temp: false },
            { section: 'sec9', text: 'Sabor e apresentação esperados', temp: false },
            { section: 'sec9', text: 'Sem contaminação cruzada', temp: false },
            { section: 'sec9', text: 'Porções padronizadas', temp: false },
            { section: 'sec9', text: 'Aprovado para serviço', temp: false },
            { section: 'sec10', text: 'Equipamentos desligados', temp: false },
            { section: 'sec10', text: 'Instalações limpas', temp: false },
            { section: 'sec10', text: 'Portas trancadas', temp: false },
            { section: 'sec10', text: 'Luz apagada', temp: false },
            { section: 'sec10', text: 'Relatório enviado', temp: false }
        ];

        function getState() {
            const dateKey = `pq_state_${document.getElementById('data').value}`;
            const stored = localStorage.getItem(dateKey);
            return stored ? JSON.parse(stored) : { items: DEFAULT_ITEMS.map(i => ({...i, checked: false, temp: ''})) };
        }

        function getSchedule() {
            return JSON.parse(localStorage.getItem('pq_schedule') || '{}');
        }

        function getSections() {
            return JSON.parse(localStorage.getItem('pq_sections') || JSON.stringify(DEFAULT_SECTIONS));
        }

        function salvarDados() {
            const dateKey = `pq_state_${document.getElementById('data').value}`;
            const items = document.querySelectorAll('#checklist input[type="checkbox"]');
            const state = getState();
            items.forEach((checkbox, idx) => {
                state.items[idx].checked = checkbox.checked;
                if(checkbox.checked && state.items[idx].temp) {
                    const tempInput = checkbox.closest('.checklist-item').querySelector('.temp-input input');
                    if(tempInput) state.items[idx].temp = tempInput.value;
                }
            });
            state.responsavel = document.getElementById('responsavel').value;
            localStorage.setItem(dateKey, JSON.stringify(state));
            updateProgress();
        }

        function mudarData() {
            salvarDados();
            renderChecklist();
            renderReport();
        }

        function requestAdminPassword() {
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        function verifyPassword() {
            const senha = document.getElementById('passwordInput').value;
            if(senha === ADMIN_PASSWORD) {
                closePasswordModal();
                showAdminPanel();
            } else {
                alert('❌ Senha incorreta');
                document.getElementById('passwordInput').value = '';
            }
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        function showAdminPanel() {
            switchTab('admin');
            if(!document.getElementById('admin')) {
                const adminPanel = document.createElement('div');
                adminPanel.id = 'admin';
                adminPanel.className = 'panel active';
                adminPanel.innerHTML = `
                    <div class="content">
                        <h2>⚙️ Painel Admin</h2>
                        <div style="margin-bottom: 20px;">
                            <h3>Seções</h3>
                            <div id="sectionsContainer"></div>
                            <button class="btn btn-primary" onclick="addSection()" style="width: 100%; margin-top: 10px;">➕ Nova Seção</button>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <h3>Itens</h3>
                            <div id="itemsContainer"></div>
                            <button class="btn btn-primary" onclick="addItem()" style="width: 100%; margin-top: 10px;">➕ Novo Item</button>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <h3>Agendamento</h3>
                            <div id="scheduleContainer"></div>
                            <button class="btn btn-primary" onclick="saveSchedule()" style="width: 100%; margin-top: 10px;">💾 Salvar Agenda</button>
                        </div>
                        <button class="btn btn-secondary" onclick="logout()" style="width: 100%;">🚪 Sair</button>
                    </div>
                `;
                document.querySelector('.container').appendChild(adminPanel);
            }
            renderAdmin();
        }

        function renderAdmin() {
            renderSections();
            renderItems();
            renderSchedule();
        }

        function renderSections() {
            const sections = getSections();
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = sections.map((sec, idx) => `
                <div style="padding: 10px; background: #f5f5f5; margin-bottom: 8px; border-radius: 5px; display: flex; gap: 10px; align-items: center;">
                    <input type="text" value="${sec.name}" style="flex: 1; padding: 5px;" placeholder="Nome" onchange="updateSectionName(${idx}, this.value)">
                    <input type="text" value="${sec.icon}" style="width: 40px; padding: 5px; text-align: center;" placeholder="Icon" onchange="updateSectionIcon(${idx}, this.value)">
                    <button class="btn btn-secondary" onclick="deleteSection(${idx})" style="padding: 5px 10px;">🗑️</button>
                </div>
            `).join('');
        }

        function updateSectionName(idx, value) {
            const sections = getSections();
            sections[idx].name = value;
            localStorage.setItem('pq_sections', JSON.stringify(sections));
            broadcastUpdate();
        }

        function updateSectionIcon(idx, value) {
            const sections = getSections();
            sections[idx].icon = value;
            localStorage.setItem('pq_sections', JSON.stringify(sections));
            broadcastUpdate();
        }

        function addSection() {
            const sections = getSections();
            const newId = `sec${sections.length + 1}`;
            sections.push({ id: newId, name: 'Nova Seção', icon: '📌' });
            localStorage.setItem('pq_sections', JSON.stringify(sections));
            renderSections();
            broadcastUpdate();
        }

        function deleteSection(idx) {
            if(confirm('Deseja deletar essa seção?')) {
                const sections = getSections();
                sections.splice(idx, 1);
                localStorage.setItem('pq_sections', JSON.stringify(sections));
                renderSections();
                broadcastUpdate();
            }
        }

        function renderItems() {
            const state = getState();
            const container = document.getElementById('itemsContainer');
            const sections = getSections();
            container.innerHTML = state.items.map((item, idx) => {
                return `
                    <div style="padding: 10px; background: #f5f5f5; margin-bottom: 8px; border-radius: 5px;">
                        <select style="width: 100%; padding: 5px; margin-bottom: 5px;" onchange="updateItemSection(${idx}, this.value)">
                            ${sections.map(s => `<option value="${s.id}" ${item.section === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
                        </select>
                        <input type="text" value="${item.text}" style="width: 100%; padding: 5px; margin-bottom: 5px;" placeholder="Texto do item" onchange="updateItemText(${idx}, this.value)">
                        <label><input type="checkbox" ${item.temp ? 'checked' : ''} onchange="updateItemTemp(${idx}, this.checked)"> Requer Temperatura</label>
                        <button class="btn btn-secondary" onclick="deleteItem(${idx})" style="padding: 5px 10px; margin-top: 5px;">🗑️</button>
                    </div>
                `;
            }).join('');
        }

        function updateItemText(idx, value) {
            const state = getState();
            state.items[idx].text = value;
            const dateKey = `pq_state_${document.getElementById('data').value}`;
            localStorage.setItem(dateKey, JSON.stringify(state));
            broadcastUpdate();
        }

        function updateItemSection(idx, value) {
            const state = getState();
            state.items[idx].section = value;
            const dateKey = `pq_state_${document.getElementById('data').value}`;
            localStorage.setItem(dateKey, JSON.stringify(state));
            broadcastUpdate();
        }

        function updateItemTemp(idx, value) {
            const state = getState();
            state.items[idx].temp = value;
            const dateKey = `pq_state_${document.getElementById('data').value}`;
            localStorage.setItem(dateKey, JSON.stringify(state));
            broadcastUpdate();
        }

        function addItem() {
            const sections = getSections();
            const state = getState();
            state.items.push({ section: sections[0].id, text: 'Novo Item', temp: false, checked: false });
            const dateKey = `pq_state_${document.getElementById('data').value}`;
            localStorage.setItem(dateKey, JSON.stringify(state));
            renderItems();
            broadcastUpdate();
        }

        function deleteItem(idx) {
            if(confirm('Deseja deletar esse item?')) {
                const state = getState();
                state.items.splice(idx, 1);
                const dateKey = `pq_state_${document.getElementById('data').value}`;
                localStorage.setItem(dateKey, JSON.stringify(state));
                renderItems();
                broadcastUpdate();
            }
        }

        function renderSchedule() {
            const schedule = getSchedule();
            const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const sections = getSections();
            const container = document.getElementById('scheduleContainer');

            container.innerHTML = days.map((day, dayIdx) => `
                <div style="margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                    <strong>${day}</strong>
                    <div style="margin-top: 8px;">
                        ${sections.map(sec => `
                            <label style="display: block; margin: 5px 0;">
                                <input type="checkbox" ${
                                    schedule[dayIdx] && schedule[dayIdx].includes(sec.id) ? 'checked' : ''
                                } onchange="updateScheduleDay(${dayIdx}, '${sec.id}', this.checked)">
                                ${sec.icon} ${sec.name}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function updateScheduleDay(dayIdx, sectionId, checked) {
            const schedule = getSchedule();
            if(!schedule[dayIdx]) schedule[dayIdx] = [];
            if(checked && !schedule[dayIdx].includes(sectionId)) {
                schedule[dayIdx].push(sectionId);
            } else if(!checked) {
                schedule[dayIdx] = schedule[dayIdx].filter(s => s !== sectionId);
            }
            localStorage.setItem('pq_schedule', JSON.stringify(schedule));
            broadcastUpdate();
        }

        function saveSchedule() {
            alert('✅ Agenda salva com sucesso!');
            broadcastUpdate();
        }

        function logout() {
            const adminTab = document.getElementById('admin');
            if(adminTab) adminTab.remove();
            switchTab('checklist');
        }

        function renderChecklist() {
            const state = getState();
            const sections = getSections();
            const container = document.getElementById('checklist');
            document.getElementById('responsavel').value = state.responsavel || '';

            container.innerHTML = state.items.map((item, idx) => {
                const isChecked = item.checked ? ' checked' : '';
                const tempInput = item.temp ? `
                    <div class="temp-input" style="${isChecked ? '' : 'display:none;'}">
                        <input type="number" placeholder="°C" value="${item.temp || ''}" onchange="salvarDados()" step="0.1">
                    </div>
                ` : '';
                const section = sections.find(s => s.id === item.section);
                const sectionName = section ? section.name : 'Sem seção';

                return `
                    <li class="checklist-item ${isChecked ? 'checked' : ''}">
                        <input type="checkbox" ${isChecked} onchange="handleCheckChange(this, ${idx})">
                        <strong>${sectionName}</strong> - ${item.text}
                        ${tempInput}
                    </li>
                `;
            }).join('');

            renderPhotos();
            updateProgress();
        }

        function handleCheckChange(checkbox, idx) {
            const item = checkbox.closest('.checklist-item');
            const tempInput = item.querySelector('.temp-input');
            if(checkbox.checked && tempInput) {
                tempInput.style.display = 'block';
                tempInput.querySelector('input').focus();
            } else if(tempInput) {
                tempInput.style.display = 'none';
            }
            salvarDados();
        }

        function renderAgenda() {
            const schedule = getSchedule();
            const sections = getSections();
            const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const container = document.getElementById('agendaContainer');

            const today = new Date(document.getElementById('data').value);
            const todayDayIdx = today.getDay();

            container.innerHTML = days.map((day, dayIdx) => {
                const enabledSections = schedule[dayIdx] ?
                    sections.filter(s => schedule[dayIdx].includes(s.id)) :
                    [];
                const isToday = dayIdx === todayDayIdx;

                return `
                    <div class="day-item ${isToday ? 'active' : ''}" style="display: inline-block; width: calc(100% / 7 - 8px); margin-bottom: 10px;" title="${day}">
                        <strong>${day}</strong>
                        <div style="margin-top: 8px; font-size: 12px;">
                            ${enabledSections.map(s => `${s.icon} ${s.name}`).join('<br>')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderReport() {
            const state = getState();
            const sections = getSections();
            const container = document.getElementById('reportContainer');

            const groupedItems = {};
            sections.forEach(sec => { groupedItems[sec.id] = { name: sec.name, icon: sec.icon, items: [] }; });

            state.items.forEach(item => {
                if(groupedItems[item.section]) {
                    groupedItems[item.section].items.push(item);
                }
            });

            let html = `<strong>Data:</strong> ${document.getElementById('data').value}<br>`;
            html += `<strong>Responsável:</strong> ${state.responsavel || 'Não informado'}<br><br>`;

            Object.values(groupedItems).forEach(section => {
                if(section.items.length > 0) {
                    html += `<h4>${section.icon} ${section.name}</h4>`;
                    section.items.forEach(item => {
                        const status = item.checked ? '✅' : '❌';
                        const temp = item.temp && item.checked ? ` (${item.temp}°C)` : '';
                        html += `<div class="report-item">${status} ${item.text}${temp}</div>`;
                    });
                    html += '<br>';
                }
            });

            container.innerHTML = html;
        }

        function renderPhotos() {
            const dateKey = `pq_photos_${document.getElementById('data').value}`;
            const photos = JSON.parse(localStorage.getItem(dateKey) || '[]');
            const grid = document.getElementById('photoGrid');

            if(photos.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Nenhuma foto ainda</p>';
                return;
            }

            grid.innerHTML = photos.map((photo, idx) => `
                <div class="photo-item" onclick="viewPhoto('${idx}')">
                    <img src="${photo}">
                    <button class="photo-delete" onclick="deletePhoto(${idx}, event)">×</button>
                </div>
            `).join('');
        }

        function openPhotoInput() {
            document.getElementById('photoInput').click();
        }

        function addPhoto(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const dateKey = `pq_photos_${document.getElementById('data').value}`;
                let photos = JSON.parse(localStorage.getItem(dateKey) || '[]');

                if(photos.length >= 10) {
                    alert('⚠️ Máximo de 10 fotos por dia atingido');
                    return;
                }

                comprimirImagem(e.target.result, (compressed) => {
                    photos.push(compressed);
                    localStorage.setItem(dateKey, JSON.stringify(photos));
                    renderPhotos();
                    event.target.value = '';
                });
            };
            reader.readAsDataURL(file);
        }

        function deletePhoto(idx, event) {
            event.stopPropagation();
            const dateKey = `pq_photos_${document.getElementById('data').value}`;
            let photos = JSON.parse(localStorage.getItem(dateKey) || '[]');
            photos.splice(idx, 1);
            localStorage.setItem(dateKey, JSON.stringify(photos));
            renderPhotos();
        }

        function viewPhoto(idx) {
            const dateKey = `pq_photos_${document.getElementById('data').value}`;
            const photos = JSON.parse(localStorage.getItem(dateKey) || '[]');
            const img = new Image();
            img.src = photos[idx];
            img.style.maxWidth = '100%';
            img.style.borderRadius = '5px';
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:999;';
            modal.appendChild(img);
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        function comprimirImagem(dataUrl, callback) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 800, maxHeight = 800;
                let width = img.width, height = img.height;

                if(width > height && width > maxWidth) {
                    height = (height * maxWidth) / width;
                    width = maxWidth;
                } else if(height > maxHeight) {
                    width = (width * maxHeight) / height;
                    height = maxHeight;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
        }

        function sendWhatsappComFotos() {
            const phone = localStorage.getItem('pq_whatsapp_phone');
            if(!phone) {
                const newPhone = prompt('📱 Digite seu número WhatsApp (com país, ex: 5511987654321)');
                if(!newPhone) return;
                localStorage.setItem('pq_whatsapp_phone', newPhone);
            }

            const state = getState();
            const sections = getSections();

            let mensagem = `*🔥 RELATÓRIO PRAÇA QUENTE*\n`;
            mensagem += `Data: ${document.getElementById('data').value}\n`;
            mensagem += `Responsável: ${state.responsavel || 'Não informado'}\n\n`;

            const groupedItems = {};
            sections.forEach(sec => { groupedItems[sec.id] = { name: sec.name, icon: sec.icon, items: [] }; });
            state.items.forEach(item => {
                if(groupedItems[item.section]) {
                    groupedItems[item.section].items.push(item);
                }
            });

            Object.values(groupedItems).forEach(section => {
                if(section.items.length > 0) {
                    mensagem += `*${section.icon} ${section.name}*\n`;
                    section.items.forEach(item => {
                        const status = item.checked ? '✅' : '❌';
                        const temp = item.temp && item.checked ? ` (${item.temp}°C)` : '';
                        mensagem += `${status} ${item.text}${temp}\n`;
                    });
                    mensagem += '\n';
                }
            });

            const dateKey = `pq_photos_${document.getElementById('data').value}`;
            const photos = JSON.parse(localStorage.getItem(dateKey) || '[]');
            if(photos.length > 0) {
                mensagem += `📸 Total de fotos: ${photos.length}\n`;
            }

            const url = `https://wa.me/${localStorage.getItem('pq_whatsapp_phone')}?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        function updateProgress() {
            const state = getState();
            const total = state.items.length;
            const completed = state.items.filter(i => i.checked).length;
            const percent = total > 0 ? (completed / total) * 100 : 0;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        function searchItems() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const items = document.querySelectorAll('#checklist .checklist-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(search) ? '' : 'none';
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');

            if(tab === 'agenda') renderAgenda();
            else if(tab === 'relatorio') renderReport();

            document.getElementById(tab).classList.add('active');
        }

        window.addEventListener('storage', (e) => {
            if(e.key && e.key.startsWith('pq_')) {
                if(currentTab === 'admin') renderAdmin();
                else {
                    renderChecklist();
                    renderReport();
                    renderAgenda();
                }
                updateProgress();
            }
        });

        function broadcastUpdate() {
            localStorage.setItem('pq_sync_' + Date.now(), 'true');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        function showInstallPrompt() {
            if(deferredPrompt) {
                deferredPrompt.prompt();
            }
        }

        function installApp() {
            if(deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if(choiceResult.outcome === 'accepted') {
                        document.getElementById('installBanner').classList.remove('show');
                        deferredPrompt = null;
                    }
                });
            }
        }

        if('serviceWorker' in navigator && window.location.protocol === 'https:') {
            const swCode = `
            const CACHE_NAME = 'pq-v2.0';
            self.addEventListener('install', event => {
                event.waitUntil(caches.open(CACHE_NAME).then(() => self.skipWaiting()));
            });
            self.addEventListener('activate', event => {
                event.waitUntil(caches.keys().then(cacheNames => {
                    return Promise.all(cacheNames.map(cacheName => {
                        if(cacheName !== CACHE_NAME) return caches.delete(cacheName);
                    }));
                }).then(() => self.clients.claim()));
            });
            self.addEventListener('fetch', event => {
                if(event.request.method !== 'GET') return;
                event.respondWith(
                    caches.match(event.request).then(response => {
                        return response || fetch(event.request).then(response => {
                            if(!response || response.status !== 200) return response;
                            const responseToCache = response.clone();
                            caches.open(CACHE_NAME).then(cache => cache.put(event.request, responseToCache));
                            return response;
                        }).catch(() => caches.match('/index.html'));
                    })
                );
            });
            `;

            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);

            navigator.serviceWorker.register(swUrl, { scope: '/' })
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('⚠️ SW:', err));
        }

        function init() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('data').value = today;
            renderChecklist();
            renderAgenda();
            renderReport();
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
