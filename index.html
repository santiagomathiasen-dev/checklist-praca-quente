<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16a865">
<meta name="description" content="Sistema de checklist para gestão de praça quente em restaurantes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Praça Quente">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Checklist — Praça Quente</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --g:#16a865;--g2:#0d7a49;--gl:#e6f7f0;
  --am:#e8930a;--aml:#fdf3e3;
  --rd:#d94040;--rdl:#fdeaea;
  --bl:#2563d4;--bll:#eef3fd;
  --bg:#f5f4f0;--card:#fff;--text:#18180f;--muted:#7d7c74;
  --border:#e5e3db;--radius:14px;--rsm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#18180f;color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOGIN ── */
#login{background:var(--g);justify-content:flex-end;padding:0}
.lhero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem 1rem;text-align:center}
.licon{width:72px;height:72px;background:rgba(255,255,255,.15);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:32px}
.lhero h1{font-size:26px;font-weight:700;color:#fff;margin-bottom:6px}
.lhero p{font-size:14px;color:rgba(255,255,255,.75)}
.lsheet{background:var(--card);border-radius:24px 24px 0 0;padding:1.75rem 1.5rem calc(1.75rem + env(safe-area-inset-bottom))}
.fl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:6px}
input.field,select.field{width:100%;border:1.5px solid var(--border);border-radius:var(--rsm);padding:13px 14px;font-family:inherit;font-size:15px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
input.field:focus,select.field:focus{border-color:var(--g)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{border:1.5px solid var(--border);border-radius:var(--rsm);padding:11px 6px;font-family:inherit;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);cursor:pointer;text-align:center;transition:all .15s;line-height:1.4}
.tbtn.sel{border-color:var(--g);background:var(--gl);color:var(--g2)}
.sec-sel-wrap{display:flex;flex-direction:column;gap:6px}
.sec-sel-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rsm);cursor:pointer;transition:all .15s;background:var(--bg)}
.sec-sel-opt.sel{border-color:var(--g);background:var(--gl)}
.sec-sel-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.sec-sel-opt.sel .sec-sel-dot{border-color:var(--g);background:var(--g)}
.sec-sel-opt.sel .sec-sel-dot::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;display:block}
.sec-sel-label{font-size:13px;font-weight:500;color:var(--text)}
.sec-sel-sub{font-size:11px;color:var(--muted);margin-top:1px}
.brow{display:flex;gap:8px;margin-top:1.25rem}
.bp{flex:1;padding:14px;border-radius:var(--rsm);border:none;background:var(--g);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.bp:disabled{opacity:.35;cursor:not-allowed}
.bp:active:not(:disabled){opacity:.85}
.badm{padding:14px 18px;border-radius:var(--rsm);border:1.5px solid var(--border);background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.fgroup{margin-top:1.25rem}

/* ── MODAL SENHA ── */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal.show{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:360px;text-align:center}
.modal-content h3{font-size:18px;margin-bottom:8px}
.modal-content p{font-size:13px;color:var(--muted);margin-bottom:1rem}
.modal-content input{width:100%;border:1.5px solid var(--border);border-radius:var(--rsm);padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:15px;text-align:center;margin-bottom:1rem;outline:none}
.modal-content input:focus{border-color:var(--g)}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:12px;border-radius:var(--rsm);border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.modal-btns .btn-cancel{background:var(--bg);color:var(--muted);border:1.5px solid var(--border)}
.modal-btns .btn-ok{background:var(--g);color:#fff}

/* ── NAV ── */
.nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1rem;height:56px;gap:10px;position:sticky;top:0;z-index:10;flex-shrink:0}
.nbk{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nbk svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:2.5}
.ntit{flex:1;min-width:0}
.ntit h2{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntit p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn{font-size:12px;font-weight:600;color:var(--g);border:1.5px solid var(--g);border-radius:20px;padding:5px 12px;background:none;cursor:pointer;white-space:nowrap;flex-shrink:0}

/* ── PROGRESS ── */
.prog{background:var(--card);padding:12px 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.plbl{font-size:12px;color:var(--muted)}
.ppct{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--g)}
.ptrack{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--g);border-radius:3px;transition:width .35s ease}

/* ── CHECKLIST ── */
#checklist{background:var(--bg)}
.chkbody{flex:1;overflow-y:auto;padding:.75rem;padding-bottom:130px}
.sec{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.semoji{font-size:17px;flex-shrink:0;width:24px;text-align:center}
.sinfo{flex:1;min-width:0}
.sname{font-size:13px;font-weight:600}
.scnt{font-size:11px;color:var(--muted);margin-top:1px}
.sbadge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0}
.bm{background:var(--bll);color:var(--bl)}
.bt{background:var(--aml);color:var(--am)}
.be{background:var(--rdl);color:var(--rd)}
.schev{color:var(--muted);font-size:10px;transition:transform .2s;flex-shrink:0}
.schev.open{transform:rotate(90deg)}
.sitems{display:none;border-top:1px solid var(--border)}
.sitems.open{display:block}

.citem{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bg);cursor:pointer;transition:background .1s;-webkit-user-select:none;user-select:none}
.citem:last-child{border-bottom:none}
.citem:active{background:var(--bg)}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cbox.done{background:var(--g);border-color:var(--g)}
.cbox.done::after{content:'';display:block;width:5px;height:9px;border:2.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}
.ctxt{font-size:13px;line-height:1.55;color:var(--text);transition:color .15s;padding-top:1px}
.ctxt.done{color:var(--muted);text-decoration:line-through}

.titem{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bg)}
.titem:last-child{border-bottom:none}
.titem-top{display:flex;align-items:flex-start;gap:10px}
.titem-icon{width:28px;height:28px;border-radius:8px;background:#eef3fd;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.titem-label{font-size:13px;line-height:1.5;color:var(--text);flex:1;padding-top:4px}
.titem-label.done{color:var(--muted)}
.titem-input-row{display:flex;align-items:center;gap:8px;margin-left:38px}
.titem-input-wrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--rsm);background:var(--bg);overflow:hidden;transition:border-color .2s;flex:1;max-width:180px}
.titem-input-wrap.filled{border-color:var(--g);background:var(--gl)}
.titem-input-wrap.warn{border-color:var(--am)!important;background:var(--aml)!important}
.titem-input-wrap.danger{border-color:var(--rd)!important;background:var(--rdl)!important}
.titem-num{border:none;background:transparent;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;color:var(--text);width:80px;padding:10px 8px 10px 12px;outline:none;text-align:right}
.titem-unit{font-size:14px;color:var(--muted);padding-right:12px;font-weight:600}
.titem-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.titem-status.ok{background:var(--gl);color:var(--g2)}
.titem-status.warn{background:var(--aml);color:var(--am)}
.titem-status.danger{background:var(--rdl);color:var(--rd)}
.titem-status.empty{background:var(--bg);color:var(--muted)}
.titem-ref{font-size:10px;color:var(--muted);margin-left:38px}

/* ── FINISH BAR ── */
.fbar{position:fixed;bottom:0;left:0;right:0;padding:10px 1rem calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);display:flex;gap:8px;z-index:10}
.bwa{flex:1;padding:13px 8px;border-radius:var(--rsm);border:none;background:#25D366;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s;opacity:.35}
.bwa svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
.bfin{flex:1;padding:13px;border-radius:var(--rsm);border:none;background:var(--g);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;opacity:.4}

/* ── DONE ── */
#done{background:var(--bg);align-items:center;justify-content:center;padding:2rem 1.5rem;overflow-y:auto}
.dcard{background:var(--card);border-radius:20px;padding:2rem 1.5rem;width:100%;max-width:400px;text-align:center}
.dcirc{width:68px;height:68px;background:var(--gl);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.dcirc svg{width:34px;height:34px;stroke:var(--g);fill:none;stroke-width:2.5}
.dcard h2{font-size:21px;font-weight:700;margin-bottom:6px}
.dcard>p{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem}
.sbox{background:var(--bg);border-radius:var(--rsm);padding:14px 10px}
.sval{font-size:26px;font-weight:700;color:var(--g)}
.slbl{font-size:11px;color:var(--muted);margin-top:2px}
.waprev{background:#e9fde9;border:1px solid #b2ddb2;border-radius:var(--rsm);padding:12px 14px;text-align:left;margin-bottom:14px;font-size:12px;line-height:1.6;color:#1a3a1a;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto}
.bwafull{width:100%;padding:14px;border-radius:var(--rsm);border:none;background:#25D366;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:opacity .15s}
.bwafull svg{width:20px;height:20px;fill:#fff}
.bwafull:active{opacity:.85}
.bout{width:100%;padding:13px;border-radius:var(--rsm);border:1.5px solid var(--border);background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}

/* ── HISTORY ── */
#history{background:var(--bg)}
.hbody{flex:1;overflow-y:auto;padding:.75rem;padding-bottom:2rem}
.hempty{text-align:center;padding:4rem 1rem;color:var(--muted);font-size:14px}
.hitem{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:8px}
.htop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.hname{font-size:14px;font-weight:600}
.hdate{font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;margin-left:8px}
.hturno{font-size:12px;color:var(--muted);margin-bottom:8px}
.hbrow{display:flex;align-items:center;gap:8px}
.hbtrack{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.hbfill{height:100%;background:var(--g);border-radius:3px}
.hbpct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--g);font-weight:500}
.hitext{font-size:11px;color:var(--muted)}
.hwabtn{margin-top:10px;width:100%;padding:9px;border-radius:var(--rsm);border:none;background:#25D366;color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.hwabtn svg{width:14px;height:14px;fill:#fff}

/* ── ADMIN ── */
#admin{background:var(--bg)}
.abody{flex:1;overflow-y:auto;padding:.75rem;padding-bottom:2rem}
.acfg{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:10px}
.acfg h3{font-size:13px;font-weight:600;margin-bottom:8px}
.acfg p{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.warow{display:flex;gap:8px}
.warow input{flex:1;border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);background:var(--bg);outline:none}
.warow input:focus{border-color:var(--g)}
.bsavewa{padding:10px 16px;border-radius:var(--rsm);border:none;background:var(--g);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.achkwrap{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:10px}
.achkname{width:100%;border:1.5px solid var(--border);border-radius:var(--rsm);padding:9px 12px;font-family:inherit;font-size:14px;font-weight:600;background:var(--bg);outline:none;margin-bottom:12px}
.achkname:focus{border-color:var(--g)}
.asec{background:var(--bg);border-radius:var(--rsm);border:1px solid var(--border);padding:12px;margin-bottom:8px}
.asecrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.aemoji{width:42px;border:1.5px solid var(--border);border-radius:var(--rsm);padding:7px;font-size:16px;text-align:center;background:var(--card);outline:none;font-family:inherit}
.atitle{flex:1;border:1.5px solid var(--border);border-radius:var(--rsm);padding:7px 10px;font-family:inherit;font-size:13px;font-weight:600;background:var(--card);outline:none}
.atitle:focus,.aemoji:focus{border-color:var(--g)}
.aturno{border:1.5px solid var(--border);border-radius:var(--rsm);padding:7px 6px;font-family:inherit;font-size:12px;background:var(--card);outline:none;-webkit-appearance:none}
.aturno:focus{border-color:var(--g)}
.bdel{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--rd);font-size:14px;flex-shrink:0}
.airow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.airow:last-child{border-bottom:none}
.airow span.anum{color:var(--muted);font-size:11px;width:18px;flex-shrink:0;text-align:right}
.airow input{flex:1;border:none;background:none;font-family:inherit;font-size:13px;color:var(--text);outline:none;padding:2px 0}
.airow .atype{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;flex-shrink:0}
.atype.temp{background:#eef3fd;color:var(--bl)}
.atype.norm{background:var(--bg);color:var(--muted)}
.aidel{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;font-size:12px;color:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.baddi{width:100%;padding:8px;border-radius:var(--rsm);border:1.5px dashed var(--border);background:none;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer;margin-top:8px;transition:all .15s}
.baddi:hover{border-color:var(--g);color:var(--g)}
.badds{width:100%;padding:12px;border-radius:var(--radius);border:1.5px dashed var(--border);background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:10px;transition:all .15s}
.badds:hover{border-color:var(--g);color:var(--g)}
.abar{background:var(--card);border-top:1px solid var(--border);padding:12px 1rem calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-shrink:0}
.bsave{flex:1;padding:14px;border-radius:var(--rsm);border:none;background:var(--g);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.breset{padding:14px;border-radius:var(--rsm);border:1.5px solid var(--border);background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div id="toast"></div>

<!-- ══ MODAL SENHA ══ -->
<div class="modal" id="modal-senha">
  <div class="modal-content">
    <h3>🔒 Acesso Admin</h3>
    <p>Digite a senha para acessar o painel de administração</p>
    <input type="password" id="inp-senha" placeholder="Digite a senha" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-ok" onclick="checkPassword()">Entrar</button>
    </div>
  </div>
</div>

<!-- ══ LOGIN ══ -->
<div class="screen active" id="login">
  <div class="lhero">
    <div class="licon">🔥</div>
    <h1>Praça Quente</h1>
    <p>Gestão de turnos e qualidade</p>
  </div>
  <div class="lsheet">
    <label class="fl">Seu nome</label>
    <input class="field" type="text" id="inp-nome" placeholder="Ex: João, Maria..." autocomplete="off" oninput="validateLogin()">

    <div class="fgroup">
      <label class="fl">Turno</label>
      <div class="tgrid" id="tgrid"></div>
    </div>

    <div class="fgroup">
      <label class="fl">O que você vai preencher?</label>
      <div class="sec-sel-wrap" id="sec-sel"></div>
    </div>

    <div class="brow">
      <button class="bp" id="btn-start" onclick="startChecklist()" disabled>Iniciar ✓</button>
      <button class="badm" onclick="goAdmin()">⚙️ Admin</button>
    </div>
  </div>
</div>

<!-- ══ CHECKLIST ══ -->
<div class="screen" id="checklist">
  <nav class="nav">
    <button class="nbk" onclick="goTo('login')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ntit">
      <h2 id="nnome">—</h2>
      <p id="nturno">—</p>
    </div>
    <button class="nbtn" onclick="goTo('history')">Histórico</button>
  </nav>
  <div class="prog">
    <div class="prow"><span class="plbl" id="plbl">Progresso</span><span class="ppct" id="ppct">0%</span></div>
    <div class="ptrack"><div class="pfill" id="pfill" style="width:0%"></div></div>
  </div>
  <div class="chkbody" id="chkbody"></div>
  <div class="fbar">

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function goTo(s){

  if(s==='history') renderHist();
  if(s==='login'){buildTurnoGrid();buildSecSel();}

// LOGIN
// ─────────────────────────────────────────────────────────────
function buildTurnoGrid(){
  const turnos=[...new Set(CL[0].sections.map(s=>s.turno))];
  const g=document.getElementById('tgrid');
  g.innerHTML=turnos.map(t=>`<button class="tbtn" onclick="selTurno(this,'${t}')">${tEmoji(t)} ${t}</button>`).join('');
}

function buildSecSel(){
  const secs=CL[0].sections;
  const wrap=document.getElementById('sec-sel');
  let html=`<div class="sec-sel-opt sel" onclick="pickSec(this,'__all__')">
    <div class="sec-sel-dot"></div>
    <div>
      <div class="sec-sel-label">Checklist completo</div>
      <div class="sec-sel-sub">Todas as ${secs.length} seções</div>

function selTurno(el,t){
  turno=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('sel'));

function pickSec(el,id){
  selSec=id;
  document.querySelectorAll('.sec-sel-opt').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');

function validateLogin(){
  user=document.getElementById('inp-nome').value.trim();
  document.getElementById('btn-start').disabled=!(user&&turno);
}

function startChecklist(){
  cid=CL[0].id;chk={};temps={};openSec={};
  document.getElementById('nnome').textContent=user;
  const secLabel=selSec==='__all__'?turno:CL[0].sections.find(s=>s.id===selSec)?.title||turno;
  document.getElementById('nturno').textContent=turno+' · '+secLabel;
  renderCL();
  goTo('checklist');
}

// ─────────────────────────────────────────────────────────────
// CHECKLIST RENDER
// ─────────────────────────────────────────────────────────────
function getActiveSecs(){
  const all=(CL.find(c=>c.id===cid)||CL[0]).sections;
  if(selSec==='__all__') return all;
  return all.filter(s=>s.id===selSec);
}

function tempStatus(val,item){
  if(val===null||val===undefined||val==='') return 'empty';
  const n=parseFloat(val);
  if(isNaN(n)) return 'empty';
  if(item.max<0){
    if(n<=item.max) return 'ok';
    if(n<=item.max+4) return 'warn';
    return 'danger';
  }
  if(n>=item.min && n<=item.max) return 'ok';
  if(n>=item.min-3 && n<=item.max+3) return 'warn';
  return 'danger';
}
function tempStatusLabel(st){
  if(st==='ok') return '✓ Ok';
  if(st==='warn') return '⚠ Atenção';
  if(st==='danger') return '✕ Fora do padrão';
  return 'Aguardando';
}

function renderCL(){
  const secs=getActiveSecs();
  const body=document.getElementById('chkbody');
  body.innerHTML='';
  secs.forEach(sec=>{
    const {tot,don}=countSec(sec);
    const isOpen=!!openSec[sec.id];
    const d=document.createElement('div');d.className='sec';
    let itemsHtml='';
    sec.items.forEach((it,i)=>{
      if(it.t==='temp'){
        const key=sec.id+'-'+i;
        const val=temps[key]||'';
        const st=tempStatus(val,it);
        itemsHtml+=`
          <div class="titem" id="titem-${sec.id}-${i}">
            <div class="titem-top">
              <div class="titem-icon">🌡️</div>
              <div class="titem-label ${chk[key]?'done':''}">${it.label}</div>
            </div>
            <div class="titem-input-row">
              <div class="titem-input-wrap ${val?st:''}" id="tiwrap-${sec.id}-${i}">
                <input class="titem-num" type="number" inputmode="decimal" placeholder="—" value="${val}"
                  id="tinput-${sec.id}-${i}"
                  onchange="setTemp('${sec.id}',${i},this.value)"
                  oninput="setTemp('${sec.id}',${i},this.value)">
                <span class="titem-unit">°C</span>
              </div>
              <span class="titem-status ${val?st:'empty'}" id="tstat-${sec.id}-${i}">${tempStatusLabel(val?st:'empty')}</span>
            </div>
            <div class="titem-ref" id="tref-${sec.id}-${i}">${it.ref||''}</div>
          </div>`;
      } else {
        const key=sec.id+'-'+i;
        itemsHtml+=`
          <div class="citem" id="ci-${sec.id}-${i}" onclick="toggleItem('${sec.id}',${i})">
            <div class="cbox ${chk[key]?'done':''}" id="cb-${sec.id}-${i}"></div>
            <span class="ctxt ${chk[key]?'done':''}" id="ct-${sec.id}-${i}">${it.label}</span>
          </div>`;
      }
    });
    d.innerHTML=`
      <div class="shead" onclick="toggleSec('${sec.id}')">
        <span class="semoji">${sec.emoji}</span>
        <div class="sinfo">
          <div class="sname">${sec.title}</div>
          <div class="scnt" id="cnt-${sec.id}">${don}/${tot} itens</div>
        </div>
        <span class="sbadge ${badgeClass(sec.turno)}">${sec.turno}</span>
        <span class="schev ${isOpen?'open':''}" id="chev-${sec.id}">&#9658;</span>
      </div>
      <div class="sitems ${isOpen?'open':''}" id="si-${sec.id}">${itemsHtml}</div>`;
    body.appendChild(d);
    if(selSec!=='__all__'&&!openSec[sec.id]){
      openSec[sec.id]=true;
      d.querySelector('.sitems').classList.add('open');
      d.querySelector('.schev').classList.add('open');
    }
  });
  updateProg();
}

function countSec(sec){
  let tot=sec.items.length,don=0;
  sec.items.forEach((it,i)=>{if(chk[sec.id+'-'+i]) don++;});
  return {tot,don};
}

function toggleSec(id){
  openSec[id]=!openSec[id];
  document.getElementById('si-'+id).classList.toggle('open',openSec[id]);
  document.getElementById('chev-'+id).classList.toggle('open',openSec[id]);
}

function toggleItem(sid,idx){
  const k=sid+'-'+idx;
  chk[k]=!chk[k];
  document.getElementById('cb-'+sid+'-'+idx).classList.toggle('done',chk[k]);
  document.getElementById('ct-'+sid+'-'+idx).classList.toggle('done',chk[k]);
  updateCount(sid);
  updateProg();
}

function setTemp(sid,idx,val){
  const k=sid+'-'+idx;
  temps[k]=val;
  const sec=getActiveSecs().find(s=>s.id===sid);
  if(!sec) return;
  const item=sec.items[idx];
  const st=tempStatus(val,item);
  const hasFill=val!==''&&val!==null&&val!==undefined;
  chk[k]=hasFill;
  const lbl=document.getElementById('titem-'+sid+'-'+idx)?.querySelector('.titem-label');
  if(lbl) lbl.className='titem-label'+(chk[k]?' done':'');
  const wrap=document.getElementById('tiwrap-'+sid+'-'+idx);
  if(wrap){ wrap.className='titem-input-wrap '+(hasFill?st:''); }
  const stEl=document.getElementById('tstat-'+sid+'-'+idx);
  if(stEl){ stEl.className='titem-status '+(hasFill?st:'empty'); stEl.textContent=tempStatusLabel(hasFill?st:'empty'); }
  updateCount(sid);
  updateProg();
  if(hasFill&&st==='danger') toast('⚠️ Temperatura fora do padrão!');
}

function updateCount(sid){
  const sec=getActiveSecs().find(s=>s.id===sid);
  if(!sec) return;
  const {tot,don}=countSec(sec);
  const el=document.getElementById('cnt-'+sid);
  if(el) el.textContent=don+'/'+tot+' itens';
}

function updateProg(){
  const secs=getActiveSecs();
  let tot=0,don=0;
  secs.forEach(s=>s.items.forEach((_,i)=>{tot++;if(chk[s.id+'-'+i])don++;}));
  const pct=tot?Math.round(don/tot*100):0;
  document.getElementById('ppct').textContent=pct+'%';
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('plbl').textContent=don+' de '+tot+' itens';
  document.getElementById('bfin').style.opacity=pct===100?'1':'.4';
  document.getElementById('bwap').style.opacity=don>0?'1':'.35';
}

// ─────────────────────────────────────────────────────────────
// WA MESSAGE
// ─────────────────────────────────────────────────────────────
function buildMsg(){
  const secs=getActiveSecs();
  let tot=0,don=0;
  secs.forEach(s=>s.items.forEach((_,i)=>{tot++;if(chk[s.id+'-'+i])don++;}));
  const pct=tot?Math.round(don/tot*100):0;
  const now=new Date();
  const hora=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const data=now.toLocaleDateString('pt-BR');
  let m='🔥 *CHECKLIST — PRAÇA QUENTE*\n';
  m+='━━━━━━━━━━━━━━━━━━━━\n';
  m+=`👤 *Responsável:* ${user}\n`;
  m+=`⏰ *Turno:* ${turno}\n`;
  if(selSec!=='__all__'){
    const sn=secs[0]?.title||'';
    m+=`📋 *Seção:* ${sn}\n`;
  }
  m+=`📅 *Data:* ${data} às ${hora}\n`;
  m+=`📊 *Progresso:* ${don}/${tot} itens (${pct}%)\n`;
  m+='━━━━━━━━━━━━━━━━━━━━\n\n';
  secs.forEach(sec=>{
    const {tot:st,don:sd}=countSec(sec);
    const all=sd===st;
    m+=`${all?'✅':'🔲'} *${sec.title}*`;
    if(!all) m+=` (${sd}/${st})`;
    m+='\n';
    sec.items.forEach((it,i)=>{
      const k=sec.id+'-'+i;
      if(it.t==='temp'){
        const val=temps[k];
        const hasFill=val!==''&&val!==undefined&&val!==null;
        if(hasFill){
          const st2=tempStatus(val,it);
          const icon=st2==='ok'?'🌡️✅':st2==='warn'?'🌡️⚠️':'🌡️❌';
          m+=`  ${icon} ${it.label}: *${val}°C*\n`;
        } else {
          m+=`  🌡️ ${it.label}: *não registrado*\n`;
        }
      } else if(!chk[k]){
        m+=`  • ${it.label}\n`;
      }
    });
    m+='\n';
  });
  m+='━━━━━━━━━━━━━━━━━━━━\n';
  m+=pct===100?'✅ *Turno 100% concluído!*\n':`⚠️ *Pendentes: ${tot-don} ${tot-don===1?'item':'itens'}*\n`;
  return m;
}

function shareWa(full){
  const msg=buildMsg();
  const num=waNum.replace(/\D/g,'');
  const url=(num?`https://wa.me/${num}?text=`:'https://wa.me/?text=')+encodeURIComponent(msg);
  window.open(url,'_blank');
}

function finishChecklist(){
  const secs=getActiveSecs();
  let tot=0,don=0;
  secs.forEach(s=>s.items.forEach((_,i)=>{tot++;if(chk[s.id+'-'+i])don++;}));
  const pct=Math.round(don/tot*100);
  const msg=buildMsg();
  hist.unshift({nome:user,turno,secao:selSec==='__all__'?'Completo':secs[0]?.title,done:don,total:tot,pct,ts:new Date().toISOString(),msg});
  if(hist.length>100) hist=hist.slice(0,100);
  saveHist();
  document.getElementById('dsub').textContent=`${user} — ${turno}`;
  document.getElementById('sdone').textContent=don;
  document.getElementById('spct').textContent=pct+'%';
  document.getElementById('waprev').textContent=msg;
  goTo('done');
}

function novoTurno(){
  document.getElementById('inp-nome').value='';
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('sel'));
  turno='';user='';selSec='__all__';
  document.getElementById('btn-start').disabled=true;
  goTo('login');
}

// ─────────────────────────────────────────────────────────────
// HISTORY
// ─────────────────────────────────────────────────────────────
function renderHist(){
  const body=document.getElementById('hbody');
  document.getElementById('hcount').textContent=hist.length+' registro'+(hist.length!==1?'s':'');
  if(!hist.length){body.innerHTML='<div class="hempty">Nenhum turno registrado ainda.</div>';return;}
  body.innerHTML=hist.map((h,i)=>{
    const d=new Date(h.ts);
    const ds=d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return `<div class="hitem">
      <div class="htop"><span class="hname">${h.nome}</span><span class="hdate">${ds}</span></div>
      <div class="hturno">${h.turno}${h.secao&&h.secao!=='Completo'?' · '+h.secao:''}</div>
      <div class="hbrow">
        <div class="hbtrack"><div class="hbfill" style="width:${h.pct}%"></div></div>
        <span class="hbpct">${h.pct}%</span>

        Reenviar pelo WhatsApp
      </button>
    </div>`;

}

function shareHistWa(idx){
  const h=hist[idx];if(!h) return;
  const msg=h.msg||`${h.nome} — ${h.turno}: ${h.pct}% (${h.done}/${h.total})`;
  const num=waNum.replace(/\D/g,'');
  window.open((num?`https://wa.me/${num}?text=`:'https://wa.me/?text=')+encodeURIComponent(msg),'_blank');
}

function clearHistory(){if(!confirm('Limpar todo o histórico?')) return;hist=[];saveHist();renderHist();}

// ─────────────────────────────────────────────────────────────
// ADMIN
// ─────────────────────────────────────────────────────────────
function renderAdmin(){
  const body=document.getElementById('abody');
  body.innerHTML='';
  const wdiv=document.createElement('div');wdiv.className='acfg';
  wdiv.innerHTML=`<h3>📱 WhatsApp para receber relatórios</h3>
    <p>Se configurado, os relatórios serão enviados direto para este número. Deixe em branco para o funcionário escolher.</p>
    <div class="warow">
      <input type="tel" id="inp-wanum" placeholder="5511999998888" value="${waNum}">
      <button class="bsavewa" onclick="saveWaNum()">Salvar</button>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:6px">Código do país + DDD + número. Ex: 5511999998888</p>`;
  body.appendChild(wdiv);
  const tip=document.createElement('div');
  tip.style.cssText='background:var(--bll);border-radius:var(--rsm);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--bl);line-height:1.5';
  tip.innerHTML='💡 <strong>Dica:</strong> itens com 🌡️ são campos de temperatura digitável. Para adicionar um, escreva o nome do item normalmente — o tipo pode ser alterado para "temp" usando o botão ao lado de cada item.';
  body.appendChild(tip);

  AD.forEach((cl,ci)=>{
    const wrap=document.createElement('div');wrap.className='achkwrap';
    let h=`<input class="achkname" value="${cl.name}" onchange="AD[${ci}].name=this.value" placeholder="Nome do checklist">`;
    cl.sections.forEach((sec,si)=>{
      h+=`<div class="asec">
        <div class="asecrow">
          <input class="aemoji" value="${sec.emoji}" maxlength="2" onchange="AD[${ci}].sections[${si}].emoji=this.value">
          <input class="atitle" value="${sec.title}" onchange="AD[${ci}].sections[${si}].title=this.value" placeholder="Nome da seção">
          <select class="aturno" onchange="AD[${ci}].sections[${si}].turno=this.value">
            ${['Manhã','Tarde','Encerramento'].map(t=>`<option ${sec.turno===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <button class="bdel" onclick="delSec(${ci},${si})">✕</button>
        </div>
        <div id="ai-${ci}-${si}">
          ${sec.items.map((it,ii)=>`
            <div class="airow">
              <span class="anum">${ii+1}.</span>
              <input value="${it.label||it}" onchange="AD[${ci}].sections[${si}].items[${ii}].label=this.value" placeholder="Item">
              <span class="atype ${it.t==='temp'?'temp':'norm'}" title="${it.t==='temp'?'Campo de temperatura':'Checkbox normal'}" style="cursor:pointer" onclick="toggleItemType(${ci},${si},${ii})">${it.t==='temp'?'🌡️ temp':'☑ check'}</span>
              <button class="aidel" onclick="delItem(${ci},${si},${ii})">✕</button>
            </div>`).join('')}
        </div>
        <button class="baddi" onclick="addItem(${ci},${si})">+ Adicionar item</button>
      </div>`;
    });
    h+=`<button class="badds" onclick="addSec(${ci})">+ Nova seção</button>`;
    wrap.innerHTML=h;body.appendChild(wrap);
  });
}

function saveWaNum(){waNum=document.getElementById('inp-wanum').value.trim();localStorage.setItem('cl_wa',waNum);toast('Número salvo! ✓');}
function toggleItemType(ci,si,ii){
  const it=AD[ci].sections[si].items[ii];
  it.t=it.t==='temp'?'check':'temp';
  if(it.t==='temp'&&!it.ref) it.ref='';
  if(it.t==='temp'&&it.min===undefined){it.min=0;it.max=10;}
  renderAdmin();
}
function delSec(ci,si){if(!confirm('Remover esta seção?')) return;AD[ci].sections.splice(si,1);renderAdmin();}
function delItem(ci,si,ii){AD[ci].sections[si].items.splice(ii,1);renderAdmin();}
function addItem(ci,si){
  AD[ci].sections[si].items.push({t:'check',label:'Novo item'});renderAdmin();
  setTimeout(()=>{
    const c=document.getElementById(`ai-${ci}-${si}`);
    if(c){const ins=c.querySelectorAll('input');const l=ins[ins.length-1];if(l){l.focus();l.select();}}
  },50);
}
function addSec(ci){
  AD[ci].sections.push({id:'s'+Date.now(),turno:'Manhã',emoji:'📋',title:'Nova seção',items:[{t:'check',label:'Primeiro item'}]});
  renderAdmin();
}
function saveAdmin(){CL=JSON.parse(JSON.stringify(AD));saveLS();buildTurnoGrid();buildSecSel();toast('Salvo com sucesso! ✓');setTimeout(()=>goTo('login'),1200);}
function resetDefault(){if(!confirm('Restaurar checklist padrão?')) return;AD=JSON.parse(JSON.stringify(DEFAULT));renderAdmin();toast('Padrão restaurado');}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
buildTurnoGrid();
buildSecSel();
</script>
