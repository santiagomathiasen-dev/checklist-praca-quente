<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Checklist operacional Praça Quente">
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Checklist%20Pra%C3%A7a%20Quente%22,%22short_name%22:%22Pra%C3%A7a%20Quente%22,%22description%22:%22Checklist%20operacional%20da%20cozinha%20quente%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23c0392b%22,%22orientation%22:%22portrait-primary%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20192%20192%27%3E%3Crect%20fill=%27%23c0392b%27%20width=%27192%27%20height=%27192%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20font-size=%27120%27%20fill=%27white%27%20text-anchor=%27middle%27%20dominant-baseline=%27middle%27%3E🔥%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22},%7B%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20512%20512%27%3E%3Crect%20fill=%27%23c0392b%27%20width=%27512%27%20height=%27512%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20font-size=%27350%27%20fill=%27white%27%20text-anchor=%27middle%27%20dominant-baseline=%27middle%27%3E🔥%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}],%22categories%22:[%22productivity%22]}">
<link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23c0392b' width='180' height='180'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle'>🔥</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23c0392b' width='180' height='180'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle'>🔥</text></svg>">
<title>Checklist Praça Quente</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;min-height:100vh;color:#1a1a2e}
.header{background:linear-gradient(135deg,#c0392b,#922b21);color:white;padding:14px 14px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.28)}
.header h1{font-size:1.2rem;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
.hdr-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);color:white;border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.hdr-btn:active{background:rgba(255,255,255,.3)}
.hdr-sub{font-size:.72rem;opacity:.78;margin:1px 0 9px}
.hdr-fields{display:flex;gap:8px;margin-bottom:9px}
.hdr-field{flex:1;display:flex;flex-direction:column;gap:3px}
.hdr-field label{font-size:.63rem;opacity:.8;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#000}
.hdr-field input{border:1.5px solid rgba(255,255,255,.35);border-radius:7px;padding:6px 9px;font-size:.82rem;color:#000;background:rgba(255,255,255,.95);outline:none;width:100%}
.hdr-field input::placeholder{color:#999}
.hdr-field input:focus{border-color:rgba(255,255,255,.75);background:white}
.hdr-field input[type=date]::-webkit-calendar-picker-indicator{filter:none;opacity:1;cursor:pointer}
.prog-wrap{background:rgba(255,255,255,.22);border-radius:20px;height:7px;overflow:hidden;margin-bottom:3px}
.prog-bar{height:100%;background:#f9e79f;border-radius:20px;transition:width .35s ease;width:0%}
.prog-lbl{font-size:.68rem;opacity:.85}
.tabs{display:flex;overflow-x:auto;background:white;border-bottom:2px solid #ebebeb;scrollbar-width:none;position:sticky;top:127px;z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:62px;padding:9px 4px 8px;font-size:.72rem;font-weight:600;color:#999;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-btn.active{color:#c0392b;border-bottom-color:#c0392b}
.tbadge{background:#eee;color:#888;font-size:.58rem;border-radius:10px;padding:1px 5px;transition:all .2s}
.tab-btn.active .tbadge{background:#fde8e6;color:#c0392b}
.tab-btn.admin-tab{color:#888}
.tab-btn.admin-tab.active{color:#555;border-bottom-color:#555}
.panel{display:none;padding:10px 12px}
.panel.active{display:block}
.section{background:white;border-radius:11px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec-hdr{padding:11px 13px;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;background:#fafafa;border-bottom:1px solid #f0f0f0}
.sec-hdr .sc{font-size:.67rem;color:#aaa;font-weight:500;text-transform:none;display:flex;align-items:center;gap:4px}
.sec-hdr .chev{font-size:.6rem;color:#ccc;transition:transform .2s}
.sec-hdr.collapsed .chev{transform:rotate(-90deg)}
.item-list{padding:3px 0}
.item-list.hidden{display:none}
.item{display:flex;align-items:flex-start;padding:10px 13px;border-bottom:1px solid #f7f7f7;gap:10px;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.item:last-child{border-bottom:none}
.item:active{background:#fdf5f4}
.item input[type=checkbox]{display:none}
.chk{width:22px;height:22px;min-width:22px;border:2px solid #ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:white;margin-top:1px}
.item.checked .chk{background:#c0392b;border-color:#c0392b}
.chk svg{display:none}
.item.checked .chk svg{display:block}
.item-body{flex:1;min-width:0}
.item-text{font-size:.86rem;color:#000;line-height:1.35;transition:color .2s}
.item.checked .item-text{color:#bbb;text-decoration:line-through}
.temp-row{display:none;margin-top:6px;align-items:center;gap:7px;flex-wrap:wrap}
.item.checked .temp-row{display:flex}
.temp-row label{font-size:.7rem;color:#c0392b;font-weight:700;white-space:nowrap}
.temp-input{border:1.5px solid #e0b0ae;border-radius:6px;padding:5px 9px;font-size:.83rem;width:100px;outline:none;transition:border-color .2s;background:#fff9f9}
.temp-input:focus{border-color:#c0392b}
.temp-unit{font-size:.75rem;color:#aaa}
.temp-row textarea{border:1.5px solid #e0e0e0;border-radius:6px;padding:5px 8px;font-size:.8rem;width:100%;resize:none;height:42px;outline:none;font-family:inherit;transition:border-color .2s;margin-top:2px}
.temp-row textarea:focus{border-color:#c0392b}
.obs-card{background:white;border-radius:11px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:10px}
.obs-card label{font-size:.68rem;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px}
.obs-card textarea{width:100%;border:1.5px solid #e8e8e8;border-radius:8px;padding:8px 10px;font-size:.83rem;font-family:inherit;resize:vertical;min-height:65px;color:#000;outline:none;transition:border-color .2s}
.obs-card textarea:focus{border-color:#c0392b}
.photos-card{background:white;border-radius:11px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:10px}
.photos-label{font-size:.68rem;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.photo-count{background:#fde8e6;color:#c0392b;border-radius:20px;padding:2px 8px;font-size:.62rem;font-weight:700}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.photo-item{position:relative;border-radius:8px;overflow:hidden;background:#f5f5f5;aspect-ratio:1;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:2px;right:2px;background:#e74c3c;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-del:active{opacity:.8}
.photos-empty{text-align:center;color:#bbb;font-size:.8rem;padding:16px 12px}
#photoInput{display:none}
.all-done{display:none;background:#e8f8f5;color:#1e8449;border:1px solid #a9dfbf;border-radius:8px;padding:9px 13px;font-size:.8rem;font-weight:600;text-align:center;margin-bottom:10px}
.rules-banner{background:#fef9e7;border-left:4px solid #f39c12;border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:10px;font-size:.76rem;line-height:1.55;color:#7d6608}
.rules-banner strong{color:#b7770d}
.empty-day{text-align:center;color:#bbb;padding:24px 12px;font-size:.85rem}
.empty-day .ed-icon{font-size:2.5rem;margin-bottom:8px}
.spacer{height:80px}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:8px;background:white;border-top:1px solid #e0e0e0;z-index:50;box-shadow:0 -2px 8px rgba(0,0,0,.1)}
.btn-reset{flex:1;padding:10px;border:1px solid #ddd;background:white;border-radius:8px;font-size:.8rem;cursor:pointer;color:#666;transition:all .2s}
.btn-reset:active{background:#f5f5f5}
.btn-wa{flex:2;padding:10px;background:#25d366;color:white;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.btn-wa:active{background:#1faa4b}
.btn-wa svg{width:16px;height:16px}
.admin-sub-tabs{display:flex;gap:4px;margin-bottom:12px;padding:8px;background:#f9f9f9;border-radius:8px;overflow-x:auto;scrollbar-width:none}
.admin-sub-tabs::-webkit-scrollbar{display:none}
.ast-btn{padding:7px 12px;border:1px solid #ddd;background:white;border-radius:6px;font-size:.75rem;font-weight:600;color:#666;cursor:pointer;white-space:nowrap;transition:all .2s}
.ast-btn.active{background:#c0392b;color:white;border-color:#c0392b}
.admin-content{display:none}
.admin-content.open{display:block}
.add-sec-card,.sec-ed-card{background:white;border-radius:11px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:10px}
.add-sec-card h4,.sec-ed-card h4{font-size:.8rem;font-weight:700;color:#333;margin-bottom:10px}
.add-sec-form{display:flex;flex-direction:column;gap:8px}
.add-sec-row{display:flex;gap:8px}
.add-sec-row input,.add-sec-row select{flex:1;padding:7px 9px;border:1.5px solid #ddd;border-radius:6px;font-size:.8rem;outline:none;transition:border-color .2s;color:#000}
.add-sec-row input:focus,.add-sec-row select:focus{border-color:#c0392b}
.btn-add-sec{padding:8px 12px;background:#27ae60;color:white;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-add-sec:active{background:#229954}
.agenda-card{background:white;border-radius:11px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.agenda-card-title{font-size:.8rem;font-weight:700;color:#333;margin-bottom:10px}
.day-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #f0f0f0}
.day-row.today-row{background:#fef9e7}
.day-name{font-size:.75rem;font-weight:600;color:#000;min-width:40px}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.sec-chip{display:inline-block;padding:6px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;transition:all .2s;border:1px solid #ddd;background:white;margin:3px;white-space:nowrap;font-weight:500}
.sec-chip.on{background:#c0392b;color:white;border-color:#c0392b}
.sec-chip.off{background:white;color:#666;border-color:#ddd}
.sec-ed-hdr{display:flex;align-items:center;gap:8px;padding:10px;background:#f9f9f9;border-radius:8px;cursor:pointer;user-select:none;transition:background .2s}
.sec-ed-hdr:active{background:#f0f0f0}
.sec-ed-icon{font-size:1.1rem}
.sec-ed-name{flex:1;font-size:.8rem;font-weight:600;color:#333}
.sec-ed-tag{font-size:.65rem;padding:2px 6px;border-radius:4px;font-weight:600}
.tag-abertura{background:#ffe0db;color:#c0392b}
.tag-mep{background:#fff4e0;color:#f39c12}
.tag-operacao{background:#e0f4ff;color:#3498db}
.tag-fechamento{background:#f0e0ff;color:#8e44ad}
.btn-del-sec{background:#e74c3c;color:white;border:none;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:.7rem;transition:background .2s}
.btn-del-sec:active{background:#c0392b}
.sec-ed-chev{color:#999;transition:transform .2s;font-size:.7rem}
.sec-ed-hdr.collapsed .sec-ed-chev{transform:rotate(-90deg)}
.sec-ed-body{display:none;padding:10px 0;border-top:1px solid #f0f0f0;margin-top:8px}
.sec-ed-body.open{display:block}
.edit-item-row{display:flex;align-items:center;gap:8px;padding:7px;background:white;border-radius:6px;margin-bottom:6px;border:1px solid #f0f0f0;font-size:.78rem}
.edit-item-text{flex:1;color:#333}
.temp-badge{background:#fde8e6;color:#c0392b;padding:2px 5px;border-radius:4px;font-size:.65rem;font-weight:600}
.btn-icon{background:none;border:none;cursor:pointer;font-size:.85rem;padding:4px;transition:opacity .2s}
.btn-icon:active{opacity:.6}
.add-item-area{padding-top:8px;border-top:1px solid #f0f0f0;margin-top:8px}
.add-item-form{display:flex;gap:6px;margin-bottom:6px}
.add-item-input{flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:.78rem;outline:none;transition:border-color .2s;color:#000}
.add-item-input:focus{border-color:#c0392b}
.btn-add-item{padding:6px 10px;background:#3498db;color:white;border:none;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-add-item:active{background:#2980b9}
.add-item-opts{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#666;cursor:pointer;user-select:none}
.add-item-opts input[type=checkbox]{cursor:pointer}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:12px;padding:16px;max-width:320px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.3)}
#modalTitle{font-size:.9rem;font-weight:700;color:#333;margin-bottom:12px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:.75rem;font-weight:600;color:#666;margin-bottom:4px}
.modal-field input{width:100%;padding:8px 10px;border:1.5px solid #ddd;border-radius:6px;font-size:.85rem;outline:none;color:#000}
.modal-field input:focus{border-color:#c0392b}
.modal-check{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#333;margin-bottom:12px;cursor:pointer;user-select:none}
.modal-check input{cursor:pointer}
.modal-btns{display:flex;gap:8px}
.btn-cancel{flex:1;padding:9px;border:1px solid #ddd;background:white;border-radius:6px;font-size:.8rem;font-weight:600;color:#666;cursor:pointer;transition:all .2s}
.btn-cancel:active{background:#f5f5f5}
.btn-confirm{flex:1;padding:9px;background:#c0392b;color:white;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-confirm:active{background:#a93226}
.password-modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center}
.password-modal-overlay.open{display:flex}
.password-modal{background:white;border-radius:12px;padding:20px;max-width:300px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.password-modal h3{font-size:.95rem;font-weight:700;color:#333;margin-bottom:12px;text-align:center}
.password-modal-input{width:100%;padding:10px;border:1.5px solid #ddd;border-radius:6px;font-size:.85rem;outline:none;margin-bottom:12px;color:#000}
.password-modal-input:focus{border-color:#c0392b}
.password-modal-btns{display:flex;gap:8px}
.btn-pwd-cancel{flex:1;padding:9px;border:1px solid #ddd;background:white;border-radius:6px;font-size:.8rem;font-weight:600;color:#666;cursor:pointer;transition:all .2s}
.btn-pwd-cancel:active{background:#f5f5f5}
.btn-pwd-confirm{flex:1;padding:9px;background:#c0392b;color:white;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-pwd-confirm:active{background:#a93226}
.password-error{color:#e74c3c;font-size:.75rem;margin-top:8px;text-align:center;display:none}
.install-banner{background:#2196f3;color:white;padding:10px;text-align:center;margin-bottom:10px;border-radius:8px;cursor:pointer;display:none;font-size:.8rem;font-weight:600}
.install-banner.show{display:block}
</style>
</head>
<body>
<div class="install-banner" id="installBanner" onclick="installApp()">📱 Toque para instalar o app no seu celular</div>
<div class="header">
  <h1>🔥 Checklist Praça Quente</h1>
  <button class="hdr-btn" onclick="openPhotoInput()" title="Tirar foto">📸</button>
</div>
<div class="hdr-fields" style="padding:0 14px 10px">
  <div class="hdr-field">
    <label>Responsável</label>
    <input type="text" id="resp" placeholder="Nome" oninput="saveState()" style="color:#000">
  </div>
  <div class="hdr-field">
    <label>Data</label>
    <input type="date" id="dateInput" onchange="onDateChange()" style="color:#000">
  </div>
</div>
<div style="padding:0 14px 10px">
  <div class="prog-wrap"><div class="prog-bar" id="pb"></div></div>
  <div class="prog-lbl" id="pl">0 de 0 itens</div>
</div>
<div class="tabs" id="mainTabs">
  <button class="tab-btn active" onclick="showTab('abertura')" id="tab-abertura">Abertura<span class="tbadge" id="badge-abertura">0/0</span></button>
  <button class="tab-btn" onclick="showTab('mep')" id="tab-mep">MEP<span class="tbadge" id="badge-mep">0/0</span></button>
  <button class="tab-btn" onclick="showTab('operacao')" id="tab-operacao">Operação<span class="tbadge" id="badge-operacao">0/0</span></button>
  <button class="tab-btn" onclick="showTab('fechamento')" id="tab-fechamento">Fechamento<span class="tbadge" id="badge-fechamento">0/0</span></button>
  <button class="tab-btn admin-tab" onclick="requestAdminPassword()" id="tab-admin">⚙️<span class="tbadge">Config</span></button>
</div>
<div id="panel-abertura" class="panel active"></div>
<div id="panel-mep" class="panel"></div>
<div id="panel-operacao" class="panel"></div>
<div id="panel-fechamento" class="panel"></div>
<div id="panel-admin" class="panel">
  <div class="admin-sub-tabs">
    <button class="ast-btn active" id="ast-agenda" onclick="showAdminTab('agenda')">📅 Agenda</button>
    <button class="ast-btn" id="ast-itens" onclick="showAdminTab('itens')">📋 Itens</button>
    <button class="ast-btn" id="ast-config" onclick="showAdminTab('config')">💬 WhatsApp</button>
    <button class="ast-btn" style="margin-left:auto" title="Recarregar mudanças" onclick="renderAdmin();alert('✅ Dados atualizados!')">🔄 Recarregar</button>
  </div>
  <div class="admin-content open" id="admin-agenda"></div>
  <div class="admin-content" id="admin-itens"></div>
  <div class="admin-content" id="admin-config">
    <div class="add-sec-card">
      <h4>💬 Configurar WhatsApp</h4>
      <div class="add-sec-form">
        <div class="add-sec-row">
          <div style="flex:1">
            <label style="font-size:.7rem;color:#888;display:block;margin-bottom:4px">Número com código do país (ex: 5511987654321)</label>
            <input type="text" id="waPhone" placeholder="5511987654321" style="width:100%">
          </div>
        </div>
        <div class="add-sec-row">
          <div style="flex:1">
            <label style="font-size:.7rem;color:#888;display:block;margin-bottom:4px">Nome do grupo (opcional)</label>
            <input type="text" id="waGroup" placeholder="Grupo Praça Quente" style="width:100%">
          </div>
        </div>
        <button class="btn-add-sec" onclick="savePhoneNumber()">✅ Salvar Configuração</button>
      </div>
    </div>
  </div>
</div>
<div id="photosPanel" style="padding:10px 12px;display:none">
  <div class="photos-card">
    <div class="photos-label">📸 Fotos do dia <span class="photo-count" id="photoCount">0</span></div>
    <div id="photosContainer" class="photos-grid"></div>
  </div>
</div>

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installBanner').classList.add('show');
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choiceResult=>{
      if(choiceResult.outcome==='accepted'){
        document.getElementById('installBanner').classList.remove('show');
        deferredPrompt=null;
      }
    });
  }
}

// SERVICE WORKER REGISTRATION
// ══════════════════════════════════════════════
if('serviceWorker' in navigator && window.location.protocol === 'https:') {
  const swCode=`
  const CACHE_NAME='pq-checklist-v1';
  const URLS_TO_CACHE=['/'];
  self.addEventListener('install',e=>{
    e.waitUntil(caches.open(CACHE_NAME).then(cache=>cache.addAll(URLS_TO_CACHE)).then(()=>self.skipWaiting()));
  });
  self.addEventListener('activate',e=>{
    e.waitUntil(caches.keys().then(cacheNames=>Promise.all(cacheNames.map(n=>{
      if(n!==CACHE_NAME)return caches.delete(n);
    }))).then(()=>self.clients.claim()));
  });
  self.addEventListener('fetch',e=>{
    if(e.request.method!=='GET')return;
    e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(r=>{
      if(!r||r.status!==200)return r;
      const rc=r.clone();
      caches.open(CACHE_NAME).then(c=>c.put(e.request,rc));
      return r;
    }).catch(()=>caches.match('/'))));
  });
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl,{scope:'/'}).then(r=>{
    console.log('✓ SW registrado');
  }).catch(e=>{
    console.log('SW error (normal se for local):',e.message);
  });
}

function buildDefaultSchedule(){const allIds=DEFAULT_SECTIONS.map(s=>s.id);const sched={};for(let d=0;d<7;d++)sched[d]=[...allIds];return sched}
const K_SECTIONS='pq_sections';
const K_ITEMS='pq_items';
const K_SCHEDULE='pq_schedule';
const K_STATE=d=>'pq_state_'+d;
const K_PHOTOS=d=>'pq_photos_'+d;
const K_WHATSAPP='pq_whatsapp_config';
function getSections(){const s=localStorage.getItem(K_SECTIONS);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_SECTIONS))}
function getItems(){const s=localStorage.getItem(K_ITEMS);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_ITEMS))}
function getSchedule(){const s=localStorage.getItem(K_SCHEDULE);return s?JSON.parse(s):buildDefaultSchedule()}
function getPhotos(date){const s=localStorage.getItem(K_PHOTOS(date));return s?JSON.parse(s):[]}
function saveSections(data){localStorage.setItem(K_SECTIONS,JSON.stringify(data))}
function saveItems(data){localStorage.setItem(K_ITEMS,JSON.stringify(data))}
function saveSchedule(data){localStorage.setItem(K_SCHEDULE,JSON.stringify(data))}
function savePhotos(date,data){localStorage.setItem(K_PHOTOS(date),JSON.stringify(data))}
function getState(date){const s=localStorage.getItem(K_STATE(date));return s?JSON.parse(s):{responsavel:'',checks:{},obs:{}}}
function putState(date,state){localStorage.setItem(K_STATE(date),JSON.stringify(state))}
let currentDate='';
let currentTab='abertura';
let dayState={responsavel:'',checks:{},obs:{}};
let photos=[];
document.addEventListener('DOMContentLoaded',()=>{
  const today=new Date();
  const y=today.getFullYear();
  const m=String(today.getMonth()+1).padStart(2,'0');
  const d=String(today.getDate()).padStart(2,'0');
  currentDate=`${y}-${m}-${d}`;
  document.getElementById('dateInput').value=currentDate;
  dayState=getState(currentDate);
  photos=getPhotos(currentDate);
  document.getElementById('resp').value=dayState.responsavel||'';
  renderAllPanels();
  updateProgress();
  renderPhotos();
  renderAdmin();
});
function onDateChange(){
  saveState();
  savePhotos(currentDate,photos);
  currentDate=document.getElementById('dateInput').value;
  dayState=getState(currentDate);
  photos=getPhotos(currentDate);
  document.getElementById('resp').value=dayState.responsavel||'';
  renderAllPanels();
  updateProgress();
  renderPhotos();
}
function saveState(){
  dayState.responsavel=document.getElementById('resp').value;
  document.querySelectorAll('.item[data-id]').forEach(el=>{
    const id=el.dataset.id;
    const checked=el.classList.contains('checked');
    const tempEl=el.querySelector('.temp-input');
    const noteEl=el.querySelector('.temp-note');
    if(!dayState.checks[id])dayState.checks[id]={};
    dayState.checks[id].checked=checked;
    if(tempEl)dayState.checks[id].temp=tempEl.value;
    if(noteEl)dayState.checks[id].note=noteEl.value;
  });
  document.querySelectorAll('textarea[data-obs]').forEach(el=>{
    dayState.obs[el.dataset.obs]=el.value;
  });
  putState(currentDate,dayState);
  updateProgress();
}
function openPhotoInput(){document.getElementById('photoInput').click()}
function addPhoto(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    if(photos.length<10){
      photos.push(evt.target.result);
      savePhotos(currentDate,photos);
      renderPhotos();
    }else{
      alert('Máx 10 fotos/dia');
    }
  };
  reader.readAsDataURL(file);
  document.getElementById('photoInput').value='';
}
function deletePhoto(idx){
  photos.splice(idx,1);
  savePhotos(currentDate,photos);
  renderPhotos();
}
function renderPhotos(){
  const panel=document.getElementById('photosPanel');
  const container=document.getElementById('photosContainer');
  const count=document.getElementById('photoCount');
  const shareBtn=document.getElementById('sharePhotosBtn');
  if(photos.length===0){
    panel.style.display='none';
    shareBtn.style.display='none';
    return;
  }
  panel.style.display='block';
  shareBtn.style.display='block';
  count.textContent=photos.length;
  container.innerHTML=photos.map((p,i)=>`<div class="photo-item"><img src="${p}" onclick="viewPhoto(${i})"><button class="photo-del" onclick="deletePhoto(${i})">✕</button></div>`).join('');
}
function viewPhoto(idx){
  const img=new Image();
  img.src=photos[idx];
  const w=window.open('');
  w.document.write(img.outerHTML);
}
const TABS=['abertura','mep','operacao','fechamento'];

    const panel=document.getElementById('panel-'+tab);
    let html=`<div class="all-done" id="alldone-${tab}">✅ ${TAB_LABELS[tab]} completo!</div>`;
    if(tab==='mep'){html+=`<div class="rules-banner"><strong>🔁 MEP é contínua</strong> — se acabou um produto, repor imediatamente.</div>`}
    const tabSecs=sections.filter(s=>s.tab===tab&&activeSecs.includes(s.id)).sort((a,b)=>a.order-b.order);
    if(tabSecs.length===0){html+=`<div class="empty-day"><div class="ed-icon">📅</div>Nenhuma seção agendada para este dia.</div>`}else{tabSecs.forEach(sec=>{const secItems=items.filter(i=>i.sec===sec.id).sort((a,b)=>a.order-b.order);html+=renderSection(sec,secItems)})}
    html+=`<div class="obs-card"><label>📝 Observações</label><textarea data-obs="${tab}" placeholder="Registre pendências..." oninput="saveState()">${dayState.obs[tab]||''}</textarea></div>`;
    panel.innerHTML=html;
  });
  updateProgress();
}
function renderSection(sec,items){
  let html=`<div class="section"><div class="sec-hdr" onclick="toggleSec(this)"><span>${sec.icon} ${sec.name}</span><span class="sc"><span id="sc_${sec.id}">0/${items.length}</span> <span class="chev">▼</span></span></div><div class="item-list">`;
  items.forEach(item=>{
    const st=dayState.checks[item.id]||{};
    const isChecked=st.checked?'checked':'';
    html+=`<div class="item ${isChecked}" data-id="${item.id}" data-type="${item.type}" onclick="toggleItem(this)"><div class="chk"><svg viewBox="0 0 12 10" fill="none" width="12" height="10"><polyline points="1,5 4.5,9 11,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="item-body"><div class="item-text">${esc(item.text)}</div>`;
    if(item.type==='temperature'){
      const tempVal=st.temp||'';
      const noteVal=st.note||'';
      html+=`<div class="temp-row" onclick="stopProp(event)"><label>🌡️ Temp:</label><input class="temp-input" type="number" step="0.1" placeholder="ex: 4.0" value="${esc(tempVal)}" oninput="saveState();validarTemperatura(this)" onchange="validarTemperatura(this)"><span class="temp-unit">°C</span><textarea class="temp-note" placeholder="Obs (opcional)" oninput="saveState()">${esc(noteVal)}</textarea></div>`;
    }
    html+=`</div></div>`;
  });
  html+=`</div></div>`;
  return html;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toggleItem(el){el.classList.toggle('checked');saveState();updateProgress()}
function stopProp(e){e.stopPropagation()}
function toggleSec(hdr){const list=hdr.nextElementSibling;hdr.classList.toggle('collapsed');list.classList.toggle('hidden')}
function updateProgress(){
  const sections=getSections();
  const items=getItems();
  const schedule=getSchedule();
  const dow=new Date(currentDate+'T12:00:00').getDay();
  const activeSecs=schedule[dow]||[];
  let grandTotal=0,grandDone=0;
  TABS.forEach(tab=>{
    const tabSecs=sections.filter(s=>s.tab===tab&&activeSecs.includes(s.id));
    const tabItems=items.filter(i=>tabSecs.some(s=>s.id===i.sec));
    const done=tabItems.filter(i=>{const el=document.querySelector(`.item[data-id="${i.id}"]`);return el?el.classList.contains('checked'):dayState.checks[i.id]&&dayState.checks[i.id].checked}).length;
    const total=tabItems.length;
    grandTotal+=total;
    grandDone+=done;
    const badge=document.getElementById('badge-'+tab);
    if(badge)badge.textContent=`${done}/${total}`;
    const allDone=document.getElementById('alldone-'+tab);
    if(allDone)allDone.style.display=total>0&&done===total?'block':'none';
    tabSecs.forEach(sec=>{
      const secItems=items.filter(i=>i.sec===sec.id);
      const sdone=secItems.filter(i=>{const el=document.querySelector(`.item[data-id="${i.id}"]`);return el?el.classList.contains('checked'):dayState.checks[i.id]&&dayState.checks[i.id].checked}).length;
      const scEl=document.getElementById('sc_'+sec.id);
      if(scEl)scEl.textContent=`${sdone}/${secItems.length}`;
    });
  });
  const pct=grandTotal>0?grandDone/grandTotal*100:0;
  document.getElementById('pb').style.width=pct.toFixed(0)+'%';
  document.getElementById('pl').textContent=`${grandDone} de ${grandTotal} itens (${pct.toFixed(0)}%)`;
}
function showTab(name){
  currentTab=name;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const panel=document.getElementById('panel-'+name);
  const btn=document.getElementById('tab-'+name);
  if(panel)panel.classList.add('active');
  if(btn)btn.classList.add('active');
  const wa=document.querySelector('.btn-wa');
  if(wa)wa.style.display=name==='admin'?'none':'';
}
function resetDay(){
  if(!confirm(`Limpar todos os itens de ${fmtDate(currentDate)}?`))return;
  const resp=document.getElementById('resp').value;
  dayState={responsavel:resp,checks:{},obs:{}};
  photos=[];
  putState(currentDate,dayState);
  savePhotos(currentDate,photos);
  renderAllPanels();
  updateProgress();
  renderPhotos();
}
function fmtDate(d){
  if(!d)return'';
  const[y,m,dd]=d.split('-');
  return`${dd}/${m}/${y}`;
}
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function showAdminTab(name){
  document.querySelectorAll('.ast-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.admin-content').forEach(c=>c.classList.remove('open'));
  document.getElementById('ast-'+name).classList.add('active');
  document.getElementById('admin-'+name).classList.add('open');
  if(name==='config'){loadPhoneNumber()}
}
function renderAdmin(){
  renderAgenda();
  renderItemEditor();
}
function renderAgenda(){
  const sections=getSections();
  const schedule=getSchedule();
  const todayDow=new Date().getDay();
  let html=`<div class="agenda-card"><div class="agenda-card-title">Seções ativas por dia</div>`;
  for(let d=0;d<7;d++){
    const isToday=d===todayDow;
    html+=`<div class="day-row ${isToday?'today-row':''}"><span class="day-name">${DAYS[d]}${isToday?' •':''}</span><div class="day-chips">`;
    sections.forEach(sec=>{
      const on=(schedule[d]||[]).includes(sec.id);
      html+=`<span class="sec-chip ${on?'on':'off'}" onclick="toggleSchedule(${d},'${sec.id}',this)" title="${sec.name}">${sec.icon} ${sec.name}</span>`;
    });
    html+=`</div></div>`;
  }
  html+=`</div>`;
  document.getElementById('admin-agenda').innerHTML=html;
}
function toggleSchedule(dow,secId,chipEl){
  const schedule=getSchedule();
  const arr=schedule[dow]||[];
  const idx=arr.indexOf(secId);
  if(idx>=0)arr.splice(idx,1);
  else arr.push(secId);
  schedule[dow]=arr;
  saveSchedule(schedule);
  chipEl.classList.toggle('on');
  chipEl.classList.toggle('off');
  const todayDow=new Date(currentDate+'T12:00:00').getDay();
  if(dow===todayDow){
    renderAllPanels();
  }
}
function renderItemEditor(){
  const sections=getSections();
  const items=getItems();
  const tabColors={abertura:'tag-abertura',mep:'tag-mep',operacao:'tag-operacao',fechamento:'tag-fechamento'};
  const tabNames={abertura:'Abertura',mep:'MEP',operacao:'Operação',fechamento:'Fechamento'};
  let html=`<div class="add-sec-card"><h4>🔍 Buscar Itens</h4><div class="add-sec-form"><input type="text" id="searchInput" placeholder="Digite para buscar..." oninput="searchItems()" style="padding:8px;border:1px solid #ddd;border-radius:6px;width:100%;color:#000"></div></div>`;
  html+=`<div class="add-sec-card"><h4>➕ Nova Seção</h4><div class="add-sec-form"><div class="add-sec-row"><input type="text" id="newSecIcon" placeholder="Ícone" style="max-width:80px"><input type="text" id="newSecName" placeholder="Nome"></div><div class="add-sec-row"><select id="newSecTab"><option>Abertura</option><option>MEP</option><option>Operação</option><option>Fechamento</option></select></div><button class="btn-add-sec" onclick="addSection()">Criar</button></div></div>`;
  sections.sort((a,b)=>a.order-b.order).forEach(sec=>{
    const secItems=items.filter(i=>i.sec===sec.id).sort((a,b)=>a.order-b.order);
    const tagClass=tabColors[sec.tab]||'';
    html+=`<div class="sec-ed-card"><div class="sec-ed-hdr collapsed" onclick="toggleSecEd(this)"><span class="sec-ed-icon">${sec.icon}</span><span class="sec-ed-name">${esc(sec.name)}</span><span class="sec-ed-tag ${tagClass}">${tabNames[sec.tab]||sec.tab}</span><button class="btn-del-sec" onclick="deleteSection(event,'${sec.id}')">🗑️</button><span class="sec-ed-chev">▼</span></div><div class="sec-ed-body">`;
    secItems.forEach(item=>{
      html+=`<div class="edit-item-row"><span class="edit-item-text">${esc(item.text)}</span>${item.type==='temperature'?'<span class="temp-badge">🌡️</span>':''}<button class="btn-icon" onclick="openEditModal('${item.id}')">✏️</button><button class="btn-icon" onclick="deleteItem('${item.id}')">🗑️</button></div>`;
    });
    html+=`<div class="add-item-area"><div class="add-item-form"><input class="add-item-input" type="text" id="newItem_${sec.id}" placeholder="Novo item..." onkeydown="if(event.key==='Enter')addItem('${sec.id}')"><button class="btn-add-item" onclick="addItem('${sec.id}')">+ Add</button></div><label class="add-item-opts"><input type="checkbox" id="newItemTemp_${sec.id}"> 🌡️ Temperatura</label></div>`;
    html+=`</div></div>`;

  document.getElementById('admin-itens').innerHTML=html;

function toggleSecEd(hdr){
  const body=hdr.nextElementSibling;
  hdr.classList.toggle('collapsed');
  body.classList.toggle('open');
}
function addSection(){
  const icon=document.getElementById('newSecIcon').value.trim()||'📌';
  const name=document.getElementById('newSecName').value.trim();
  const tabName=document.getElementById('newSecTab').value.toLowerCase();
  if(!name)return;
  const sections=getSections();
  const id='sec_'+Date.now();
  sections.push({id,name,icon,tab:tabName,order:sections.length});
  saveSections(sections);
  const schedule=getSchedule();
  for(let d=0;d<7;d++){
    if(!schedule[d])schedule[d]=[];
    schedule[d].push(id);
  }
  saveSchedule(schedule);
  document.getElementById('newSecIcon').value='';
  document.getElementById('newSecName').value='';
  renderAdmin();
  renderAllPanels();
}
function deleteSection(event,secId){
  event.stopPropagation();
  const sections=getSections();
  const sec=sections.find(s=>s.id===secId);
  if(!confirm(`Excluir seção "${sec?.name}"?`))return;
  const newSections=sections.filter(s=>s.id!==secId);
  const newItems=getItems().filter(i=>i.sec!==secId);
  saveSections(newSections);
  saveItems(newItems);
  const schedule=getSchedule();
  for(let d=0;d<7;d++){
    if(schedule[d])schedule[d]=schedule[d].filter(id=>id!==secId);
  }
  saveSchedule(schedule);
  renderAdmin();
  renderAllPanels();
}
function addItem(secId){
  const input=document.getElementById('newItem_'+secId);
  const text=input.value.trim();
  if(!text)return;
  const isTemp=document.getElementById('newItemTemp_'+secId).checked;
  const items=getItems();
  const secItems=items.filter(i=>i.sec===secId);
  items.push({id:'item_'+Date.now(),text,sec:secId,type:isTemp?'temperature':'default',order:secItems.length});
  saveItems(items);
  input.value='';
  document.getElementById('newItemTemp_'+secId).checked=false;
  renderAdmin();
  renderAllPanels();
}
function deleteItem(itemId){
  const items=getItems();
  const item=items.find(i=>i.id===itemId);
  if(!confirm(`Excluir "${item?.text}"?`))return;
  saveItems(items.filter(i=>i.id!==itemId));
  if(dayState.checks[itemId]){
    delete dayState.checks[itemId];
    saveState();
  }
  renderAdmin();
  renderAllPanels();
}
let _editingItemId=null;
function openEditModal(itemId){
  const items=getItems();
  const item=items.find(i=>i.id===itemId);
  if(!item)return;
  _editingItemId=itemId;
  document.getElementById('modalTitle').textContent='Editar item';
  document.getElementById('modalText').value=item.text;
  document.getElementById('modalIsTemp').checked=item.type==='temperature';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  _editingItemId=null;
  document.getElementById('modalOverlay').classList.remove('open');
}
function saveModalItem(){
  const text=document.getElementById('modalText').value.trim();
  const isTemp=document.getElementById('modalIsTemp').checked;
  if(!text||!_editingItemId){
    closeModal();
    return;
  }
  const items=getItems();
  const item=items.find(i=>i.id===_editingItemId);
  if(item){
    item.text=text;
    item.type=isTemp?'temperature':'default';
  }
  saveItems(items);
  closeModal();
  renderAdmin();
  renderAllPanels();
}
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modalOverlay'))closeModal();
});
function getWhatsappConfig(){
  const cfg=localStorage.getItem(K_WHATSAPP);
  return cfg?JSON.parse(cfg):{phone:'',groupName:''};
}
function saveWhatsappConfig(cfg){
  localStorage.setItem(K_WHATSAPP,JSON.stringify(cfg));

function sendWhatsapp(){
  saveState();
  const resp=document.getElementById('resp').value.trim()||'Não informado';
  const sections=getSections();
  const items=getItems();
  const schedule=getSchedule();
  const dow=new Date(currentDate+'T12:00:00').getDay();
  const activeSecs=schedule[dow]||[];
  let msg=`🔥 *CHECKLIST PRAÇA QUENTE*\n`;
  msg+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  msg+=`👤 *Responsável:* ${resp}\n`;
  msg+=`📅 *Data:* ${fmtDate(currentDate)}\n`;
  if(photos.length>0)msg+=`📸 *Fotos anexadas:* ${photos.length}\n`;
  msg+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  let overallOk=true;
  TABS.forEach(tab=>{
    const tabSecs=sections.filter(s=>s.tab===tab&&activeSecs.includes(s.id));
    const tabItems=items.filter(i=>tabSecs.some(s=>s.id===i.sec));
    if(tabItems.length===0)return;
    const done=tabItems.filter(i=>dayState.checks[i.id]?.checked).length;
    const total=tabItems.length;
    const pct=Math.round(done/total*100);
    const status=done===total?'✅':done===0?'❌':'⚠️';
    if(done<total)overallOk=false;
    msg+=`${status} *${tab.toUpperCase()}* (${done}/${total} - ${pct}%)\n`;
    msg+=`${'═'.repeat(30)}\n`;
    tabItems.forEach(item=>{
      const isChecked=dayState.checks[item.id]?.checked;
      const icon=isChecked?'✅':'❌';
      const st=dayState.checks[item.id]||{};
      msg+=`${icon} ${item.text}`;
      if(isChecked&&item.type==='temperature'&&st.temp){
        msg+=` 🌡️ ${st.temp}°C`;
        if(st.note)msg+=` (${st.note})`;
      }
      msg+='\n';
    });
    const obs=dayState.obs[tab];
    if(obs&&obs.trim()){
      msg+=`\n📌 *Obs:* ${obs.trim()}\n`;
    }
    msg+='\n';
  });
  msg+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  msg+=overallOk?'🏆 *TURNO 100% CONCLUÍDO!*':'⚠️ *ATENÇÃO: HÁ ITENS PENDENTES*';
  const cfg=getWhatsappConfig();
  const phone=cfg.phone.trim();
  const url=phone?`https://wa.me/${phone}?text=`:`https://wa.me/?text=`;
  window.open(url+encodeURIComponent(msg),'_blank');
}
function sharePhotos(){
  if(photos.length===0){
    alert('Nenhuma foto para compartilhar');
    return;
  }
  if(!navigator.share){
    alert('Seu navegador não suporta compartilhamento. Abra no WhatsApp manualmente.');
    return;
  }
  const filesToShare=[];
  async function prepareShare(){
    try{
      for(let i=0;i<Math.min(photos.length,5);i++){
        const response=await fetch(photos[i]);
        const blob=await response.blob();
        const file=new File([blob],`foto_${i+1}.jpg`,{type:'image/jpeg'});
        filesToShare.push(file);
      }
      if(navigator.share){
        await navigator.share({title:'Fotos - Praça Quente',text:`Fotos do checklist de ${fmtDate(currentDate)}`,files:filesToShare});
      }else{
        alert('Compartilhamento não disponível');
      }
    }catch(err){
      console.error('Erro ao compartilhar:',err);
      alert('Erro ao preparar fotos para compartilhamento');
    }
  }
  prepareShare();
}
function savePhoneNumber(){
  const phone=document.getElementById('waPhone').value.trim();
  const groupName=document.getElementById('waGroup').value.trim();
  if(!phone){
    alert('Adicione um número de WhatsApp válido');
    return;
  }

function loadPhoneNumber(){

}
window.addEventListener('storage',e=>{
  if(e.key&&(e.key.startsWith('pq_'))){

    else renderAllPanels();
    updateProgress();
  }

function comprimirImagem(base64,callback){
  const img=new Image();
  img.src=base64;
  img.onload=()=>{
    const canvas=document.createElement('canvas');
    let w=img.width,h=img.height;
    if(w>h){if(w>800){h=Math.round(h*800/w);w=800}}
    else{if(h>800){w=Math.round(w*800/h);h=800}}
    canvas.width=w;
    canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    callback(canvas.toDataURL('image/jpeg',0.7));
  };
}
function comprimirPhotos(photosArray,callback){
  let processed=0;
  const compressed=[];
  photosArray.forEach((foto,idx)=>{
    comprimirImagem(foto,resultado=>{
      compressed[idx]=resultado;
      processed++;
      if(processed===photosArray.length)callback(compressed);
    });
  });
}

      const total=tabItems.length;
      const pct=Math.round(done/total*100);
      const status=done===total?'✅':done===0?'❌':'⚠️';

      msg+=`${status} *${tab.toUpperCase()}* (${done}/${total} - ${pct}%)\n`;
      msg+=`${'═'.repeat(30)}\n`;
      tabItems.forEach(item=>{

        const st=dayState.checks[item.id]||{};
        msg+=`${icon} ${item.text}`;
        if(isChecked&&item.type==='temperature'&&st.temp){
          msg+=` 🌡️ ${st.temp}°C`;
          if(st.note)msg+=` (${st.note})`;
        }
        msg+='\n';
      });
      const obs=dayState.obs[tab];
      if(obs&&obs.trim()){
        msg+=`\n📌 *Obs:* ${obs.trim()}\n`;
      }
      msg+='\n';
    });
    msg+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    msg+=overallOk?'🏆 *TURNO 100% CONCLUÍDO!*':'⚠️ *ATENÇÃO: HÁ ITENS PENDENTES*';
    msg+=`\n\n📸 *FOTOS ANEXADAS:*\n`;
    compressed.forEach((foto,i)=>{
      msg+=`Foto ${i+1}: ${foto.substring(0,50)}...\n`;
    });
    const phone=cfg.phone.trim();
    const url=`https://wa.me/${phone}?text=`;
    window.open(url+encodeURIComponent(msg),'_blank');
  });
}
function validarTemperatura(input){
  const val=parseFloat(input.value);
  if(isNaN(val)||val<=0){
    input.style.borderColor='#e0b0ae';
    input.style.backgroundColor='#fff9f9';
    return;
  }
  if(val>8){
    input.style.borderColor='#e74c3c';
    input.style.backgroundColor='#ffe0e0';
  }else{
    input.style.borderColor='#c0392b';
    input.style.backgroundColor='#fff9f9';
  }
}
function searchItems(){
  const query=document.getElementById('searchInput').value.toLowerCase();
  const items=document.querySelectorAll('.edit-item-row');
  items.forEach(item=>{
    const text=item.textContent.toLowerCase();
    item.style.display=text.includes(query)?'flex':'none';
  });
}
